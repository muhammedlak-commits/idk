<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Saleem Store — home medical supplies to buy, rent or refill monthly, ordered on WhatsApp.">
<meta name="theme-color" content="#003260" id="themeColor">
<script>try{var th=JSON.parse(localStorage.getItem('saleem-store:theme'));if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest" data-pwa>
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" data-pwa>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متجر سليم">
<title>متجر سليم</title>
<link rel="preload" href="assets/fonts/cairo-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin data-pwa>
<style>
/* the brand faces, served with the shop (variable: every weight in one file). OFL — see assets/fonts/ */
@font-face{font-family:Cairo;font-style:normal;font-display:swap;font-weight:200 1000;src:url(assets/fonts/cairo-arabic-wght-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Cairo;font-style:normal;font-display:swap;font-weight:200 1000;src:url(assets/fonts/cairo-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/montserrat-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --navy:#003260;--navy2:#002444;--blue:#1C75BC;--blue50:#EDF6FD;--blue100:#D6E9F8;
  --or:#C4510F;--or2:#A8480F;--orBrand:#F47B20;--wa:#12733F;--wa2:#0E5C32;--or50:#FFF3E9;--green:#12806F;--green50:#E8F6F3;--red:#C0392B;
  --ink:#10222F;--mut:#58708A;--line:#DDE6EE;--paper:#F4F8FB;--white:#fff;--card:#fff;
  --r:14px;--shadow:0 12px 32px rgba(0,36,68,.12);--shc:0,36,68;
  --fill:#003260;--fill2:#002444;--card2:#FAFCFE;--ink2:#3C566C;--line2:#C9D7E3;--greenInk:#0E5D51;--orInk:#7A3A0C;--orLine:#F3C9A8;--orDeep:#A8480F;--redInk:#8E2A20;--red50:#FBEBE9;
  --dot:#8FA6BA;--phIcon:#9DB8CE;--phBg:linear-gradient(145deg,#F8FBFD,#EAF2F8);--barBg:rgba(255,255,255,.97);--footBg:#002444;
  color-scheme:light;--tabH:56px;--barH:68px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.6 Montserrat,system-ui,sans-serif;min-width:320px}
html[lang=ar] body{font-family:Cairo,system-ui,sans-serif;font-weight:500}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid rgba(28,117,188,.55);outline-offset:2px}
::selection{background:var(--blue100);color:var(--navy2)}
input,textarea{caret-color:var(--blue)}
::placeholder{color:#5F7488;opacity:1}
.wrap{width:min(100% - 32px,1240px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--fill);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{top:10px}

/* ── top bar ─────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--barBg);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.bar .wrap{height:var(--barH);display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;flex:none;min-height:44px}
.logo img{height:36px;width:auto}
.logo span{font-size:12px;font-weight:800;color:var(--mut);border-inline-start:1px solid var(--line);padding-inline-start:10px;line-height:1.2}
.search{flex:1;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,117,188,.12);background:var(--card)}
.search .ic{color:var(--blue)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:none;padding:4px;color:var(--mut);display:none}
.search.has .clear{display:grid}
.pill{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--navy);font-size:14px;font-weight:800;white-space:nowrap}
.pill:hover{border-color:var(--blue)}
.pill.solid{background:var(--fill);border-color:var(--fill);color:#fff}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--or);color:#fff;font:800 12px/22px Montserrat,sans-serif;text-align:center}
.count[data-n="0"]{background:rgba(255,255,255,.25)}
.pill:not(.solid) .count[data-n="0"]{background:var(--line);color:var(--mut)}

/* ── tabs: top strip on desktop, bottom bar on phones ─ */
.tabs{position:sticky;top:var(--barH);z-index:39;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;height:var(--tabH);align-items:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--mut);font-size:14px;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--navy)}
.tab[aria-current=page]{color:var(--navy);border-color:var(--or)}
.tab .count{margin-inline-start:2px}
.tab.clinic{margin-inline-start:auto}

main{min-height:60vh;padding-bottom:40px}
.view{animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1,h2,h3{color:var(--navy2);line-height:1.25;margin:0;text-wrap:balance}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0!important;line-height:1.35}
html[lang=ar] body{line-height:1.7}
.price,.optPrice,.sum,.orderNo,.found,.count,.stepper span{font-variant-numeric:tabular-nums}
p,li{text-wrap:pretty}
h1:focus{outline:0}
.sec{margin-top:40px}
.secHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.secHead h2{font-size:22px}
.secHead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.more{color:var(--blue);font-weight:800;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-height:44px}
.more .ic{width:16px;height:16px}
html[dir=rtl] .flip{transform:scaleX(-1)}

/* ── home ────────────────────────────────────────── */
.hero{background:linear-gradient(125deg,#EAF5FE 0%,#F8FCFF 50%,#FFF3E9 100%);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:44px 0}
.hero h2{font-size:clamp(28px,3vw,40px);margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--blue)}
.hero p{margin:0 0 20px;color:var(--ink2);font-size:16px;max-width:52ch}
.hero .search{height:54px;background:var(--card);box-shadow:0 6px 20px rgba(var(--shc),.07)}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:800;transition:background .15s,transform .15s}
.btn.or{background:var(--or);color:#fff;box-shadow:0 8px 20px rgba(168,72,15,.22)}
.btn.or:hover{background:var(--orDeep)}
.btn.navy{background:var(--fill);color:#fff}
.btn.navy:hover{background:var(--fill2)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.wa{background:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.heroImg{border-radius:20px;overflow:hidden;border:6px solid #fff;box-shadow:var(--shadow);aspect-ratio:16/10;background:#E8F1F8}
.heroImg img{width:100%;height:100%;object-fit:cover;display:block}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.quick small{color:var(--mut);font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--navy);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip:hover{border-color:var(--blue)}
.chip[aria-current=true],.chip[aria-pressed=true]{background:var(--fill);border-color:var(--fill);color:#fff}
.chip b{font:700 12px Montserrat,sans-serif;opacity:.65}

.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dept{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);transition:transform .15s,box-shadow .15s,border-color .15s}
.dept:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--blue100)}
.dIcon{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--blue50);color:var(--blue)}
.dIcon .ic{width:26px;height:26px;stroke-width:1.6}
.dept strong{display:block;color:var(--navy2);font-size:15.5px;line-height:1.3}
.dept small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:3px}
.dept em{display:inline-block;margin-top:6px;font:700 12px Montserrat,sans-serif;font-style:normal;color:var(--blue)}
.dept.clinic{background:var(--fill);border-color:var(--fill)}
.dept.clinic .dIcon{background:rgba(255,255,255,.12);color:#fff}
.dept.clinic strong{color:#fff}.dept.clinic small{color:#BFD6EA}.dept.clinic em{color:#FFB37A}

.services{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.svc{padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,transform .15s}
.svc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.svc .dIcon{background:var(--or50);color:var(--or2);margin-bottom:6px}
.svc strong{color:var(--navy2);font-size:16px}
.svc small{color:var(--mut);font-size:13px;line-height:1.5}
.svc em{font-style:normal;color:var(--or2);font-weight:800;font-size:13px;margin-top:auto;padding-top:6px}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
@media(min-width:1100px){.rail{grid-auto-columns:calc((100% - 48px)/5)}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.step:before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:#fff;font:800 14px Montserrat,sans-serif;margin-bottom:10px}
.step strong{display:block;color:var(--navy2);font-size:16px}
.step p{margin:4px 0 0;color:var(--mut);font-size:14px}

/* ── product card ───────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--blue100)}
.card>a{display:flex;flex-direction:column;flex:1}
.ph{position:relative;aspect-ratio:4/3;background:var(--phBg);display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;background:#fff;opacity:0;transition:opacity .25s cubic-bezier(.16,1,.3,1)}
.ph img.in{opacity:1}
.ph .fb{color:var(--phIcon);display:grid;place-items:center}
.ph .fb .ic{width:44px;height:44px;stroke-width:1.3}
.ph.noimg img{display:none}
.badges{position:absolute;z-index:2;top:8px;inset-inline-start:8px;display:flex;flex-wrap:wrap;gap:4px}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-size:12.5px;font-weight:800;line-height:1.4;background:var(--card);box-shadow:0 1px 3px rgba(var(--shc),.12)}
.bdg .ic{width:13px;height:13px;stroke-width:2.2}
.bdg.rent{color:var(--or2)}.bdg.refill{color:var(--green)}.bdg.quote{color:#5B3A85}
.cBody{padding:12px 14px 4px;flex:1}
.cBody small{display:block;color:var(--mut);font-size:12.5px;font-weight:700}
.grid.noSub .cBody small{display:none}
.cBody h3{font-size:15px;margin-top:3px;line-height:1.35}
.cFoot{padding:10px 14px 14px}
.add{width:100%;height:44px;border:1px solid var(--navy);border-radius:10px;background:var(--card);color:var(--navy);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.add:hover{background:var(--fill);color:#fff}
.add .ic{width:18px;height:18px}
.stepper{display:flex;align-items:center;height:46px;border:1px solid var(--fill);border-radius:10px;overflow:hidden;background:var(--fill);color:#fff}
.stepper button{width:44px;height:100%;border:0;background:transparent;color:inherit;display:grid;place-items:center}
.stepper button:hover{background:rgba(255,255,255,.12)}
.stepper span{flex:1;text-align:center;font-weight:800;font-size:14px}
.stepper.light{background:var(--card);color:var(--navy);border-color:var(--line)}
.stepper.light button:hover{background:var(--paper)}

.price{margin:6px 0 0;color:var(--navy);font:800 14px Montserrat,sans-serif}
html[lang=ar] .price{font-family:Cairo,sans-serif}
.price small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.price.ask{color:var(--mut);font-size:13px;font-weight:700}
.price.big{font-size:22px;margin-top:12px}
.bdg.out{color:var(--red)}
.add.ask{border-color:var(--line);color:var(--mut);font-size:13px}
.add.ask:hover{background:var(--paper);color:var(--navy)}
.optPrice{margin-inline-start:auto;text-align:end;color:var(--navy);font:800 14px Montserrat,sans-serif;white-space:nowrap}
.optPrice small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.note.out{background:var(--red50);color:var(--redInk);margin-top:18px}
.sum.est{border-top:1px dashed var(--line);margin-top:0;color:var(--navy)}
.estNote{margin:0;color:var(--mut);font-size:12.5px}
.previewBar{position:relative;z-index:45;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;background:var(--orDeep);color:#fff;font-size:13.5px;font-weight:800;text-align:center}
.previewBar[hidden]{display:none}
.previewBar a{color:#fff;text-decoration:underline}
.loading{height:60vh}

/* ── list pages ─────────────────────────────────── */
.pageHead{background:var(--card);border-bottom:1px solid var(--line)}
.pageHead .wrap{padding:12px 0 0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;color:var(--mut);font-size:13px;font-weight:700;margin-bottom:4px}
.crumbs a{color:var(--blue);display:inline-flex;align-items:center;min-height:44px}
.crumbs .ic{width:14px;height:14px}
.ttl{display:flex;gap:14px;align-items:center}
.ttl h1{font-size:clamp(24px,2.6vw,32px)}
.ttl p{margin:2px 0 0;color:var(--mut);font-size:14.5px}
.subtabs{display:flex;gap:4px;overflow-x:auto;margin-top:18px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--mut);font-size:14px;font-weight:800;white-space:nowrap}
.subtab:hover{color:var(--navy)}
.subtab[aria-current=page]{color:var(--navy);border-color:var(--or)}
.subtab b{font:700 12px Montserrat,sans-serif;opacity:.6;margin-inline-start:4px}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:11px;background:var(--card);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:800;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--fill);color:#fff}
.sel{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:13.5px;font-weight:700;color:var(--navy)}
.found{color:var(--mut);font-size:14px;font-weight:700}
.found b{color:var(--navy)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.empty{text-align:center;padding:48px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty .dIcon{margin:0 auto 12px}
.empty strong{display:block;color:var(--navy2);font-size:17px}
.empty p{color:var(--mut);margin:6px 0 16px}
.loadMore{display:flex;justify-content:center;margin-top:18px}

.deptList{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.dRow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dRow>a{display:flex;gap:14px;align-items:center}
.dRow>a strong{display:block;color:var(--navy2);font-size:17px}
.dRow>a small{color:var(--mut);font-size:13.5px}
.dRow>a .ic.go{margin-inline-start:auto;color:var(--mut)}
.dRow .chips{flex-wrap:wrap;margin-top:12px;padding:0}
.dRow.clinic{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}

.mSearch{display:none;margin:16px 0 4px}

/* ── product page ───────────────────────────────── */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:20px;align-items:start}
.pd .ph{aspect-ratio:1/1;border-radius:18px;border:1px solid var(--line)}
.pd .ph img{padding:28px}
.pd .ph .fb .ic{width:80px;height:80px}
.phNote{color:var(--mut);font-size:12.5px;margin-top:8px;text-align:center}
.pInfo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.pInfo h1{font-size:clamp(24px,2.4vw,30px)}
.pInfo .alt{color:var(--mut);font-size:14px;margin-top:2px}
.pInfo .badges{position:static;margin-top:12px}
.pInfo .bdg{box-shadow:none;border:1px solid currentColor;padding:4px 9px;font-size:12.5px}
.why{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--blue50);color:var(--ink2);font-size:15px}
.why b{display:block;color:var(--navy);font-size:13px;margin-bottom:2px}
.lbl{display:block;margin:20px 0 8px;color:var(--navy2);font-size:14px;font-weight:800}
.svcList{display:flex;flex-wrap:wrap;gap:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:4px;accent-color:var(--navy);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--card2)}
.opt strong{display:block;color:var(--navy2);font-size:15px}
.opt small{color:var(--mut);font-size:13px}
.buy{display:grid;grid-template-columns:140px 1fr;gap:10px;margin-top:18px}
.buy .stepper{height:50px}
.buy .btn{min-height:50px}
.priceNote{display:flex;gap:8px;margin-top:14px;color:var(--mut);font-size:13.5px}
.priceNote .ic{color:var(--green);width:18px;height:18px;margin-top:2px}

/* ── order ──────────────────────────────────────── */
.order{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start;margin-top:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-size:18px;margin-bottom:4px}
.panel>p{margin:0 0 14px;color:var(--mut);font-size:14px}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .ph{aspect-ratio:1;border-radius:10px;border:1px solid var(--line)}
.line .ph img{padding:6px}
.line .ph .fb .ic{width:28px;height:28px}
.line h3{font-size:14.5px}
.line .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.line .sel{height:44px;font-size:13.5px}
.line .stepper{height:46px;width:132px}
.line .stepper button{width:44px}
.rm{border:0;background:none;color:var(--mut);width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.rm:hover{color:var(--red);background:var(--red50)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13.5px;font-weight:800;color:var(--navy2);margin-bottom:5px}
.field span i{font-style:normal;color:var(--mut);font-weight:600}
.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:15px;background:var(--card)}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,117,188,.12)}
.field.bad input{border-color:var(--red)}
.field .err{display:none;color:var(--red);font-size:12.5px;margin-top:4px}
.field.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-top:4px;border-top:1px solid var(--line);font-weight:800;color:var(--navy2)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--green50);color:var(--greenInk);font-size:13.5px;margin:12px 0}
.note .ic{flex:none;margin-top:1px}
.sent{text-align:center}
.sent .dIcon{margin:0 auto 12px;background:var(--green50);color:var(--green)}

/* ── footer, toast ──────────────────────────────── */
footer{background:var(--footBg);color:#A8BED0;padding:36px 0 30px;font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
footer img{height:40px;background:#fff;border-radius:10px;padding:6px 10px}
footer p{margin:0;max-width:60ch}
footer a{color:#fff;font-weight:800;display:inline-flex;align-items:center;min-height:44px}
.toast{position:fixed;z-index:80;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:var(--footBg);color:#fff;font-size:14px;font-weight:700;box-shadow:var(--shadow);transform:translateY(140%);opacity:0;transition:.22s}
.toast.on{transform:none;opacity:1}
.toast button{border:0;background:none;color:#FFB37A;font-weight:800;min-height:44px;margin-block:-12px;padding-inline:4px;text-decoration:underline;text-underline-offset:3px}
.toast a{color:#FFB37A;font-weight:800;display:inline-flex;align-items:center;min-height:44px;margin-block:-12px;padding-inline:4px}

/* ── responsive ─────────────────────────────────── */
@media(max-width:1000px){
  .services{grid-template-columns:repeat(2,1fr)}
  .order{grid-template-columns:1fr}
}
@media(max-width:760px){
  :root{--barH:60px}
  body{padding-bottom:calc(var(--tabH) + env(safe-area-inset-bottom))}
  .wrap{width:min(100% - 32px,700px)}
  .bar .search,.logo span,.bar .lang-full{display:none}
  .bar .wrap{justify-content:space-between}
  .logo img{height:32px}
  .tabs{position:fixed;top:auto;bottom:0;inset-inline:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(var(--shc),.08)}
  .tabs .wrap{width:100%;gap:0}
  .tab{flex:1;min-width:0;flex-direction:column;justify-content:center;gap:2px;padding:0;font-size:12.5px;line-height:1.2;border-bottom:0;border-top:3px solid transparent;margin:0;position:relative}
  .tab[aria-current=page]{border-color:var(--or)}
  .tab .ic{width:22px;height:22px}
  .tab .count{position:absolute;top:5px;inset-inline-start:calc(50% + 4px);min-width:20px;height:20px;font-size:12px;line-height:20px;padding:0 5px}
  .tab.clinic{display:none}
  .bar .order-pill{display:none}
  .hero .wrap{grid-template-columns:1fr;padding:26px 0 30px;gap:20px}
  .heroImg{aspect-ratio:16/7;border-width:4px;border-radius:16px}
  .hero p{font-size:15px}
  .sec{margin-top:30px}
  .secHead h2{font-size:19px}
  .depts{grid-template-columns:1fr 1fr;gap:8px}
  .dept{flex-direction:column;gap:8px;padding:14px}
  .dept small{display:none}
  .dIcon{width:42px;height:42px}
  .services{gap:8px}
  .svc{padding:14px}.svc small{display:none}
  .steps{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .rail{grid-auto-columns:46%}
  .cBody{padding:10px 10px 2px}.cBody h3{font-size:14px}.cFoot{padding:8px 10px 10px}
  .bdg{font-size:12.5px;padding:2px 6px}
  .deptList{grid-template-columns:1fr}
  .pd{grid-template-columns:1fr;gap:14px;margin-top:12px}
  .pd .ph{aspect-ratio:4/3}
  .pInfo{padding:18px}
  .buy{grid-template-columns:116px 1fr}
  .mSearch{display:flex}
  .two{grid-template-columns:1fr}
  .toast{bottom:calc(var(--tabH) + 14px + env(safe-area-inset-bottom))}
  .pageHead .wrap{padding-top:6px}
}
@media(max-width:360px){.grid{grid-template-columns:1fr}.buy{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── banners ────────────────────────────────────── */
.bannerWrap{padding-top:20px}
.banners{position:relative}
.bTrack{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px;scroll-behavior:smooth}
.bTrack::-webkit-scrollbar{display:none}
.banner{position:relative;scroll-snap-align:start;aspect-ratio:1240/440;border-radius:22px;overflow:hidden;color:#fff;display:block;isolation:isolate}
.banner.navy{background:linear-gradient(120deg,#002444,#003260 55%,#0A5A96)}
.banner.orange{background:linear-gradient(120deg,#7E3208,#A8440C 55%,#C4510F)}
.banner.green{background:linear-gradient(120deg,#0B5247,#12806F 60%,#2BA392)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.banner.hasImg:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,24,45,.82) 0%,rgba(0,24,45,.55) 42%,rgba(0,24,45,0) 72%)}
html[dir=rtl] .banner.hasImg:after{background:linear-gradient(270deg,rgba(0,24,45,.82) 0%,rgba(0,24,45,.55) 42%,rgba(0,24,45,0) 72%)}
.banner .deco{position:absolute;inset-inline-end:-30px;bottom:-40px;width:340px;height:340px;opacity:.14;z-index:-1}
.banner .deco .ic{width:100%;height:100%;stroke-width:1}
.bText{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 clamp(22px,5vw,64px);max-width:min(640px,72%)}
.bText h2{color:#fff;font-size:clamp(24px,3.2vw,42px);line-height:1.15;letter-spacing:-.01em}
.bText p{margin:0;font-size:clamp(14px,1.4vw,17px);opacity:.92;max-width:46ch}
.bCta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:11px 18px;border-radius:12px;background:var(--card);color:var(--navy2);font-weight:800;font-size:14.5px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.banner:hover .bCta{background:var(--or50)}
.bDots{display:flex;justify-content:center;margin-top:2px}
.bDots button{width:44px;height:44px;border:0;padding:0;background:none;display:grid;place-items:center}
.bDots button:before{content:"";width:8px;height:8px;border-radius:4px;background:var(--dot);transition:width .2s cubic-bezier(.16,1,.3,1),background .2s}
.bDots button[aria-current=true]:before{width:24px;background:var(--fill)}
.bArrow{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--navy);display:grid;place-items:center;box-shadow:var(--shadow);z-index:2}
.bArrow.prev{inset-inline-start:12px}.bArrow.next{inset-inline-end:12px}
html[dir=ltr] .bArrow.prev .ic,html[dir=rtl] .bArrow.next .ic{transform:scaleX(-1)}

/* search card + trust strip under the banner */
.homeSearch{display:flex;flex-direction:column;gap:10px}
.homeSearch .search{height:54px;background:var(--card);box-shadow:0 6px 20px rgba(var(--shc),.06)}
.homeSearch .quick{margin-top:0}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}
.trustItem{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.trustItem .dIcon{width:42px;height:42px;background:var(--green50);color:var(--green)}
.trustItem:nth-child(2) .dIcon{background:var(--or50);color:var(--or2)}
.trustItem:nth-child(3) .dIcon{background:var(--blue50);color:var(--blue)}
.trustItem strong{display:block;color:var(--navy2);font-size:14.5px;line-height:1.3}
.trustItem small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4}
a.trustItem:hover{border-color:var(--blue)}

/* finder card, kits */
.finderCta{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:18px;background:linear-gradient(120deg,var(--blue50),var(--card));border:1px solid var(--blue100)}
.finderCta .dIcon{width:54px;height:54px;background:var(--card);box-shadow:0 4px 12px rgba(var(--shc),.08)}
.finderCta strong{display:block;color:var(--navy2);font-size:18px}
.finderCta p{margin:2px 0 0;color:var(--mut);font-size:14px}
.finderCta .acts{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:8px}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kit{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .15s,box-shadow .15s}
.kit:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.kitThumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.kitThumbs .ph{aspect-ratio:1}
.kitThumbs .ph img{padding:6px}
.kitThumbs .ph .fb .ic{width:26px;height:26px}
.kitBody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.kitBody .kTop{display:flex;align-items:center;gap:8px}
.kitBody .kTop .dIcon{width:34px;height:34px;border-radius:9px;background:var(--or50);color:var(--or2)}
.kitBody .kTop .dIcon .ic{width:20px;height:20px}
.kitBody strong{color:var(--navy2);font-size:16px;line-height:1.3}
.kitBody p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5}
.kitBody em{margin-top:auto;padding-top:8px;font-style:normal;color:var(--or2);font-weight:800;font-size:13.5px}
.kitLines .line{grid-template-columns:64px 1fr auto}
.kitAdd{position:sticky;top:calc(var(--barH) + var(--tabH) + 12px)}
.situations{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:20px}
.situation{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:start;font-weight:800;color:var(--navy2);font-size:15.5px}
.situation:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.situation .dIcon{background:var(--or50);color:var(--or2)}

/* returning customers */
.again{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.again .dIcon{background:var(--green50);color:var(--green)}
.again.low{border-color:var(--orLine);background:var(--or50)}
.again.low .dIcon{background:var(--card);color:var(--or)}
.again small{display:block}
.again strong{display:block;color:var(--navy2)}
.again small{color:var(--mut);font-size:13px}
.again .btn{margin-inline-start:auto;min-height:42px}

/* product page extras */
.facts{display:grid;gap:8px;margin-top:16px}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.fact .ic{color:var(--blue);margin-top:1px}
.fact b{color:var(--navy2)}
.soldBy{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:8px;background:var(--paper);color:var(--mut);font-size:12.5px;font-weight:800}
.soldBy b{color:var(--navy)}
.pActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pActions .btn{min-height:44px;font-size:13.5px;padding:0 14px}
.btn.soft{background:var(--blue50);color:var(--navy);border-color:var(--blue100)}
.btn.soft:hover{border-color:var(--blue)}
.tiersNote{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--or50);color:var(--orInk);font-size:13px}
.stickyBuy{display:none}

/* order extras */
.pays{display:grid;gap:8px;margin-bottom:12px}
.pays label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.pays label:has(input:checked){border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.pays input{accent-color:var(--navy);width:17px;height:17px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--paper);font-size:13.5px;margin-bottom:12px;cursor:pointer}
.check input{accent-color:var(--navy);width:18px;height:18px;margin-top:2px;flex:none}
.sum.small{font-weight:700;color:var(--mut);font-size:14px;padding:6px 0;border-top:0;margin:0}
.orderNo{display:inline-block;margin:6px 0 2px;padding:4px 12px;border-radius:8px;background:var(--paper);font:800 15px Montserrat,monospace;color:var(--navy);letter-spacing:.05em}
footer .pays-f{display:flex;flex-wrap:wrap;gap:6px}
footer .pays-f span{padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.08);color:#DCE8F2;font-size:12px;font-weight:700}

@media(max-width:760px){
  .bannerWrap{padding-top:12px}
  .banner{aspect-ratio:16/11;border-radius:18px}
  .bTrack{border-radius:18px}
  .bText{max-width:100%;justify-content:flex-end;padding:20px;gap:8px}
  .banner.hasImg:after,html[dir=rtl] .banner.hasImg:after{background:linear-gradient(0deg,rgba(0,24,45,.92) 0%,rgba(0,24,45,.7) 55%,rgba(0,24,45,.35) 100%)}
  .bText h2{font-size:21px}.bText p{font-size:13.5px}.bCta{padding:9px 14px;font-size:13.5px}
  .bArrow{display:none}
  .banner .deco{width:220px;height:220px}
  .trust{grid-template-columns:1fr;gap:8px}
  .trustItem{padding:12px 14px}
  .finderCta{flex-wrap:wrap;padding:16px}
  .finderCta .acts{margin-inline-start:0;width:100%}
  .finderCta .acts .btn{flex:1}
  .kits{grid-template-columns:1fr}
  .situations{grid-template-columns:1fr}
  .stickyBuy{position:fixed;z-index:38;inset-inline:0;bottom:calc(var(--tabH) + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(var(--shc),.1);transform:translateY(120%);transition:transform .2s}
  .stickyBuy.on{transform:none}
  .stickyBuy span{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--navy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stickyBuy small{display:block;color:var(--mut);font-weight:700;font-size:12.5px}
  .stickyBuy .btn{min-height:44px}
}

/* ── home: the visit question leads ─────────────── */
.lead{background:var(--card);border-bottom:1px solid var(--line)}
.lead .wrap{padding:28px 0 22px}
.lead h1{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.01em;text-wrap:balance}
.lead>.wrap>p{margin:6px 0 0;color:var(--mut);font-size:15px;max-width:60ch}
.visits{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.visit{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);transition:border-color .15s,background .15s}
.visit:hover{border-color:var(--blue);background:var(--card)}
.visit .dIcon{grid-row:span 2;background:var(--or50);color:var(--or2)}
.visit strong{display:block;color:var(--navy2);font-size:16px;line-height:1.3}
.visit small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:2px}
.visit em{font-style:normal;color:var(--or2);font-weight:800;font-size:13px}
.leadAlt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:12px 0 0;font-size:14px;color:var(--mut)}
.leadAlt a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--blue);font-weight:800}
.leadAlt .ic{width:18px;height:18px}

/* departments, grouped by kind of need */
.homeSearch{margin:0 0 18px}
.dGroups{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.dGroup h3{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:800}
.dMini{display:grid;gap:2px}
.dm{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px;margin-inline:-10px;border-radius:12px;color:var(--navy2);font-weight:800;font-size:15px;line-height:1.3}
.dm:hover{background:var(--card);box-shadow:0 2px 10px rgba(var(--shc),.06)}
.dm .dIcon{width:40px;height:40px;border-radius:10px}
.dm .dIcon .ic{width:22px;height:22px}
.clinicRow{display:flex;align-items:center;gap:10px;min-height:52px;margin-top:18px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--navy);font-weight:800;font-size:14.5px}
.clinicRow:hover{border-color:var(--blue)}
.clinicRow span{flex:1}
.clinicRow .ic{color:var(--mut)}
.steps+.trust{margin-top:12px}

/* cards say which mode is in the order */
.stepper span small{display:block;font-size:12px;font-weight:700;opacity:.85;line-height:1.1}
.stepper span{line-height:1.15}

/* product page */
.opt .terms{display:block;margin-top:4px;color:var(--ink2);font-size:12.5px}
details.facts{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.facts summary{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;cursor:pointer;list-style:none;font-size:14px;color:var(--ink2)}
details.facts summary::-webkit-details-marker{display:none}
details.facts summary>.ic:first-child{color:var(--blue)}
details.facts summary span{flex:1}
details.facts summary b{color:var(--navy2)}
details.facts summary .ic.more{width:16px;height:16px;color:var(--mut);transform:rotate(90deg);transition:transform .2s cubic-bezier(.16,1,.3,1)}
details.facts[open] summary .ic.more{transform:rotate(-90deg)}
details.facts .fact{padding:0 14px 12px 44px}
html[dir=rtl] details.facts .fact{padding:0 44px 12px 14px}
details.facts .fact .ic{display:none}

/* order: sent state */
.note.warn{background:var(--or50);color:var(--orInk);margin:18px 0 0}
.linkBtn{border:0;background:none;padding:0;color:var(--navy);font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:24px}
.sentP{color:var(--mut);margin:14px 0 0}
.sentP bdi{color:var(--navy2);font-weight:800;white-space:nowrap}
.sentItems{text-align:start;margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--paper)}
.sentItems h2{font-size:14px;color:var(--mut);margin:0 0 6px}
.sentItems ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px;color:var(--navy2)}
.sentItems li span{color:var(--mut);font-size:13px}
.sentActs{display:grid;gap:10px;margin-top:18px}
.confirm{padding:14px;border:1px solid var(--line);border-radius:12px;text-align:start}
.confirm p{margin:0 0 10px;font-weight:800;color:var(--navy2)}
.confirm div{display:flex;flex-wrap:wrap;gap:8px}
.confirm .btn{flex:1}
.field .hint{display:block;color:var(--mut);font-size:12.5px;font-weight:600;margin:-2px 0 6px}
.kPick{display:grid;place-items:center;width:44px;height:44px;cursor:pointer}
.kPick input{width:20px;height:20px;accent-color:var(--navy)}
.kitLines>p{margin:0 0 4px;color:var(--mut);font-size:14px}
.tShort{display:none}

@media(max-width:1000px){
  .visits{grid-template-columns:1fr 1fr}
  .dGroups{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .tab .tLong{display:none}.tab .tShort{display:inline}
  .homeSearch .quick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .homeSearch .quick::-webkit-scrollbar{display:none}
  .homeSearch .quick small{flex:none}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .lead .wrap{padding:18px 0 16px}
  .lead>.wrap>p{font-size:14px}
  .visits{gap:8px;margin-top:14px}
  .visit{grid-template-columns:1fr;grid-template-rows:auto;row-gap:2px;padding:12px}
  .visit .dIcon{grid-row:auto;width:38px;height:38px;margin-bottom:4px}
  .visit small{display:none}
  .visit strong{font-size:15px}
  .leadAlt{margin-top:6px;gap:0 16px}
  .dGroups{grid-template-columns:1fr;gap:18px}
  .dMini{grid-template-columns:1fr 1fr;gap:6px}
  .dm{margin:0;padding:8px;background:var(--card);border:1px solid var(--line);font-size:13.5px;gap:8px;min-height:56px}
  .dm .dIcon{width:34px;height:34px}
  .dm .dIcon .ic{width:20px;height:20px}
  .pd .ph{aspect-ratio:2/1}
  .pInfo h1{font-size:22px}
  .pd .ph img{padding:12px}
  .phNote{margin-top:4px}
  .opt{padding:10px 12px}
  .pdPage{padding-bottom:76px}
  .sentActs .btn{width:100%}
}

/* ── choice sheet: a bottom sheet on phones, a small dialog on desktop ── */
.sheet{border:0;padding:0;width:min(440px,calc(100% - 32px));border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(var(--shc),.28)}
.sheet::backdrop{background:rgba(0,24,45,.45)}
.sheet[open]{animation:sheetIn .26s cubic-bezier(.16,1,.3,1)}
.sheet[open]::backdrop{animation:fadeIn .2s ease-out}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
.sheetIn{padding:18px 18px 12px}
.sheetHead{display:grid;grid-template-columns:56px 1fr 44px;gap:12px;align-items:center}
.sheetHead .ph{aspect-ratio:1;border-radius:12px;border:1px solid var(--line)}
.sheetHead .ph img{padding:4px}
.sheetHead .ph .fb .ic{width:26px;height:26px}
.sheetHead h2{font-size:16.5px;line-height:1.35}
.sheetHead p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.sheetX{width:44px;height:44px;border:0;border-radius:12px;background:var(--paper);color:var(--navy);display:grid;place-items:center}
.sheetOpts{display:grid;gap:8px;margin:16px 0 4px}
.sheetOpt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:start}
.sheetOpt:hover,.sheetOpt:focus-visible{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.sheetOpt span{flex:1;min-width:0}
.sheetOpt strong{display:block;color:var(--navy2);font-size:15.5px}
.sheetOpt small{display:block;color:var(--mut);font-size:13px}
.sheetOpt>.ic{color:var(--or);width:22px;height:22px}
.sheetOpt .optPrice{margin-inline-start:0}
@media(max-width:760px){
  .sheet{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .sheet[open]{animation:sheetUp .32s cubic-bezier(.16,1,.3,1)}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .sheetIn:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
}

/* ── page changes: the photo grows from the card into the product page ── */
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s;animation-timing-function:ease-out}
::view-transition-group(pphoto){animation-duration:.34s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
::view-transition-old(pphoto),::view-transition-new(pphoto){animation-duration:.34s;height:100%;object-fit:contain}
.bar{view-transition-name:bar}.tabs{view-transition-name:tabs}
html.vt .view{animation:none}
.fly{position:fixed;z-index:90;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--card);box-shadow:0 8px 20px rgba(var(--shc),.25);pointer-events:none;display:grid;place-items:center;color:var(--blue)}
.fly img{width:100%;height:100%;object-fit:contain;padding:6px;background:#fff}

.installCard{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--blue100)}
.installCard img{width:56px;height:56px;border-radius:14px;box-shadow:0 2px 8px rgba(var(--shc),.12)}
.installCard span:not(.acts){flex:1;min-width:200px}
.installCard strong{display:block;color:var(--navy2);font-size:16px}
.installCard small{display:block;color:var(--mut);font-size:13.5px}
.installCard .acts{display:flex;gap:8px;flex-wrap:wrap}

.listHow{margin:0 0 16px;padding-inline-start:22px;display:grid;gap:6px;color:var(--ink2);font-size:14.5px}
.listShots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.listShots figure{position:relative;margin:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.listShots figure img{width:100%;height:100%;object-fit:cover;display:block}
.listShots .rm{position:absolute;top:6px;inset-inline-end:6px;background:var(--card);color:var(--navy2)}
.listPick{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;border:2px dashed var(--blue100);border-radius:12px;background:var(--blue50);color:var(--navy);font-weight:800;font-size:14px;text-align:center;cursor:pointer}
.listPick .ic{width:34px;height:34px;color:var(--blue)}
.listPick:hover,.listPick:focus-within{border-color:var(--blue)}
.listPanel .listShots:has(figure) .listPick{aspect-ratio:3/4}
.listShots:not(:has(figure)){grid-template-columns:1fr}
.listShots:not(:has(figure)) .listPick{aspect-ratio:auto;min-height:180px}

.trackOut{margin-top:16px}
.trackOut>.btn{margin-top:10px}
.trackCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.trackTop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.trackTop small{color:var(--mut);font-size:13px}
.steps4{list-style:none;margin:18px 0 6px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.steps4 li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;font-size:13px;color:var(--mut)}
.steps4 li:not(:first-child):before{content:"";position:absolute;top:13px;inset-inline-end:50%;width:100%;height:3px;background:var(--line);z-index:0}
.steps4 li.done:not(:first-child):before,.steps4 li.now:not(:first-child):before{background:var(--green)}
.steps4 .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:3px solid var(--line);color:#fff}
.steps4 .dot .ic{width:15px;height:15px;stroke-width:2.6}
.steps4 li.done .dot,.steps4 li.now .dot{background:var(--green);border-color:var(--green)}
.steps4 li.now .dot{box-shadow:0 0 0 5px var(--green50)}
.steps4 li.now b{color:var(--navy2)}
.steps4 b{font-weight:800}
.trackCancel{margin:14px 0;color:var(--red);font-weight:800}
.trackItems{list-style:none;margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--paper);display:grid;gap:6px;font-size:14px;color:var(--navy2)}
.trackItems span{color:var(--mut);font-size:13px}

.tab[hidden]{display:none!important}
@media(min-width:761px){.homeSearch form{display:none}}

/* ── loading: skeletons while the catalog arrives, a shimmer while a photo loads ── */
.sk{display:block;border-radius:10px;background:linear-gradient(90deg,var(--line) 0%,var(--card2) 50%,var(--line) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

.ph:not(.noimg):has(img:not(.in)):after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.6) 50%,transparent 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.themeBtn{width:44px;padding:0;justify-content:center}

function setCatalog(cat){
  SITE = cat.site; S = SITE.settings;
  // the clinic department disappears with the clinic switch
  DEPTS = cat.departments.filter(d => d.key !== 'clinic' || clinicsOn());
  DEPT = Object.fromEntries(DEPTS.map(d => [d.key, d]));
  // a product pointing at a department or section that no longer exists can't be shown
  PRODUCTS = cat.products.filter(p => DEPT[p.dept] && DEPT[p.dept].subs.some(s => s.key === p.sub) && (!p.b2b || clinicsOn()));
  BYID = new Map(PRODUCTS.map(p => [String(p.id), p]));
  RETAIL = PRODUCTS.filter(p => !p.b2b);
  HAY = new Map(PRODUCTS.map(p => {
    const d = DEPT[p.dept], s = subOf(p);
    return [p.id, { name: norm(p.en + ' ' + p.ar), rest: norm([d.en, d.ar, s.en, s.ar, p.whyEn, p.whyAr].join(' ')) }];
  }));
  STORES = new Map(SITE.stores.filter(x => x.on).map(x => [x.id, x]));
  // a kit keeps only items still in the shop, each in a mode that's still offered
  KITS = !S.kits.on ? [] : SITE.kits.filter(k => k.on).map(k => Object.assign({}, k, {
    items: k.items.map(i => ({ p: BYID.get(String(i.id)), qty: i.qty, mode: i.mode })).filter(i => i.p)
      .map(i => Object.assign(i, { mode: modesFor(i.p).includes(i.mode) ? i.mode : modesFor(i.p)[0] })),
  })).filter(k => k.items.length);
  SOURCE = cat.source;
  $$('[data-tab=kits]').forEach(el => el.hidden = !KITS.length);
  $$('[data-tab=clinic]').forEach(el => el.hidden = !clinicsOn() || !PRODUCTS.some(p => p.b2b));
}

const cardMode = (p, want) => modesFor(p).includes(want) ? want : modesFor(p)[0];
const fixedMode = (p, want) => modesFor(p).includes(want) ? want : '';
const shortMode = m => t({buy:'fBuy', rent:'bRent', refill:'bRefill', quote:'bQuote'}[m]);

function addControl(p, want){

  const mode = fixed || modes.find(m => qtyOf(p.id, m)) || modes[0], q = qtyOf(p.id, mode);
  if(q) return `<div class="stepper" data-line="${p.id}|${mode}"><button type="button" data-dec aria-label="−">${icon('i-minus')}</button><span>${num(q)}${many ? `<small>${shortMode(mode)}</small>` : ''}</span><button type="button" data-inc aria-label="+">${icon('i-plus')}</button></div>`;
  return `<button type="button" class="add" data-add="${p.id}|${mode}">${icon('i-plus')}${p.b2b ? t('addQuote') : mode === 'rent' ? t('addRent') : mode === 'refill' && many ? t('addRefill') : t('add')}</button>`;
}

// "25,000 IQD", or "Rent from 40,000 IQD / month" when only the rental is priced
function priceLine(p, mode){
  if(p.b2b) return '';
  if(mode === 'rent' && p.rentPrice && rentOn()) return `<p class="price">${fmtIqd(p.rentPrice)}<small>${t('perMonth')}</small></p>`;

  if(rent) return `<p class="price">${t('rentFrom', {p: fmtIqd(p.rentPrice)})}</p>`;
  return `<p class="price ask">${t('priceAsk')}</p>`;
}

/* search — matches Arabic regardless of hamza, taa marbuta, alef maqsura or diacritics */
const norm = s => String(s).toLowerCase()
  .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
  .replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
function search(q){
  const words = norm(q).split(' ').filter(Boolean);
  if(!words.length) return [];
  const scored = [];
  for(const p of PRODUCTS){
    const h = HAY.get(p.id); let score = 0, ok = true;
    for(const w of words){
      if(h.name.split(' ').some(x => x.startsWith(w))) score += 3;
      else if(h.name.includes(w)) score += 2;
      else if(h.rest.includes(w)) score += 1;
      else { ok = false; break; }
    }
    if(ok) scored.push([score + (p.b2b ? -.5 : 0) + (3 - p.tier) * .1, p]);
  }
  return scored.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

/* ═══════════════════════════════════════════════════════════
   ROUTER — everything lives behind #/…, so it works off disk
   and the back button moves between views, not down the page
   ═══════════════════════════════════════════════════════════ */
function parse(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), qs: new URLSearchParams(qs || '') };
}
const scrollMemo = {};
let freshNav = false, quietHash = null;

function render(){
  const { parts, qs } = parse();
  const [a, b, c] = parts;
  let html, tab = null, title = '';
  stopBanners();
  if(!a)                         { tab = 'home';  html = viewHome(); }

  else if((a === 'rent' && rentOn()) || a === 'refill') { tab = 'home'; title = t(a === 'rent' ? 'secRent' : 'secRefill'); html = viewCollection(a, qs); }
  else if(a === 'kits' && KITS.length) { tab = 'kits'; title = t('kitsTitle'); html = viewKits(); }
  else if(a === 'k' && kitById(b)) { tab = 'kits'; title = L(kitById(b)); html = viewKit(kitById(b)); }

  else if(a === 'track')         { tab = 'order'; title = t('trackT'); html = viewTrack(b); }

  $('#view').innerHTML = `<div class="view">${html}</div>`;
  $$('.tab').forEach(el => { if(el.dataset.tab === tab) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); });

let lastHash = location.hash, booted = false;
function onRoute(){
  const key = location.hash;
  if(quietHash === key){ quietHash = null; return; }
  hideToast(); closeSheet();
  const from = lastHash; lastHash = key;
  // typing into search jumps to the Search tab mid-word: that one draws at once, no transition
  const vt = booted && !searchFocus && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  booted = true;
  if(!vt){ routeNow(); return; }
  // the photo of the product being opened (or left) morphs between the card and the page
  const pid = h => (h.match(/^#\/p\/(\d+)/) || [])[1];
  const onScreen = el => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight && r.width; };
  const cardPh = id => $$(`[data-card="${id}"] .ph`).find(onScreen);
  const name = el => { if(el){ el.style.viewTransitionName = 'pphoto'; named.push(el); } };
  const named = [], to = pid(key), back = pid(from);
  if(to) name(cardPh(to)); else if(back) name($('.pd .ph'));
  const tr = document.startViewTransition(() => { named.forEach(el => el.style.viewTransitionName = ''); named.length = 0; routeNow(); if(to) name($('.pd .ph')); else if(back) name(cardPh(back)); });
  tr.finished.finally(() => named.forEach(el => el.style.viewTransitionName = ''));
}
function routeNow(){
  const key = location.hash;
  // back/forward restores how far you'd scrolled and how many cards were open
  shown = freshNav ? CONFIG.pageSize : (shownMemo[key] || CONFIG.pageSize);
  render();
  if(searchFocus){
    // the search box you were typing in was replaced by the Search view: carry on in the visible one
    const i = [...$$('.mSearch input'), $('#q')].find(x => x.offsetParent);
    if(i){ i.focus({preventScroll:true}); i.setSelectionRange(i.value.length, i.value.length); }
    searchFocus = false; window.scrollTo(0, 0);
  } else if(freshNav){
    window.scrollTo(0, 0);
    const h = $('#view h1'), act = document.activeElement;
    if(h && !(act && act.matches('input'))){ h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); }
  } else window.scrollTo(0, scrollMemo[key] || 0);
  freshNav = false;
}
const shownMemo = {};
let searchFocus = false;
window.addEventListener('hashchange', onRoute);
let scrollT;
window.addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(() => { scrollMemo[location.hash] = window.scrollY; }, 80); }, {passive:true});

// update the URL without a re-render (search-as-you-type, filters)
function setHashQuietly(h){

  try{ history.replaceState(null, '', h); }catch(e){ quietHash = h; location.replace(h); }
}
const withQs = (base, obj) => { const qs = new URLSearchParams(); for(const k in obj) if(obj[k]) qs.set(k, obj[k]); const s = qs.toString(); return base + (s ? '?' + s : ''); };

let bTimer = null;
function stopBanners(){ clearInterval(bTimer); bTimer = null; }
function startBanners(){
  const tr = $('#bTrack'); if(!tr) return;
  const n = tr.children.length, dots = $$('[data-bdot]');
  const at = () => Math.round(Math.abs(tr.scrollLeft) / tr.clientWidth);
  tr.addEventListener('scroll', () => { const i = at(); dots.forEach((d, k) => d.setAttribute('aria-current', String(k === i))); }, { passive: true });
  if(n < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let paused = false;
  ['mouseenter', 'focusin', 'touchstart'].forEach(ev => tr.addEventListener(ev, () => paused = true, { passive: true }));
  ['mouseleave', 'focusout'].forEach(ev => tr.addEventListener(ev, () => paused = false));
  // no point turning slides nobody can see
  const onScreen = () => { const r = tr.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };
  bTimer = setInterval(() => { if(!paused && !document.hidden && onScreen()) goBanner((at() + 1) % n); }, 6000);
}
function goBanner(i){
  const tr = $('#bTrack'); if(!tr) return;
  const n = tr.children.length; i = (i + n) % n;
  // scroll the track sideways only — scrollIntoView would also drag the page up to the banner.
  // Right-to-left tracks count scrollLeft from 0 downwards.
  const x = i * tr.clientWidth * (getComputedStyle(tr).direction === 'rtl' ? -1 : 1);
  tr.scrollTo({ left: x, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

// filter + sort + grid, shared by department, service, collection and search views
function listing(items, { base, qs, filters = true, sortable = true, chips = '', mode, noSub }){
  const f = qs.get('show') || '', sort = qs.get('sort') || '';

  if(f === 'buy')    list = list.filter(p => !p.b2b);

  if(sortable) list = [...list].sort(sort === 'az' ? byName : byNeed);
  const avail = ['rent', 'refill'].filter(k => items.some(p => p[k] && (k !== 'rent' || rentOn())));
  const seg = filters && avail.length && !items.every(p => p.b2b)
    ? `<div class="seg" role="group" aria-label="${esc(t('show'))}">${['', ...avail].map(k => `<button type="button" data-filter="${k}" aria-pressed="${f === k}">${t({'':'fAll', buy:'fBuy', rent:'fRent', refill:'fRefill'}[k])}</button>`).join('')}</div>` : '<span></span>';
  const sorter = sortable ? `<label><span class="sr">${t('sort')}</span><select class="sel" data-sort><option value="">${t('sortRec')}</option><option value="az" ${sort === 'az' ? 'selected' : ''}>${t('sortAz')}</option></select></label>` : '';

    ? `<h2 class="sr">${t('products')}</h2><div class="grid ${noSub ? 'noSub' : ''}">${list.slice(0, shown).map(cardAs(mode || (f === 'rent' || f === 'refill' ? f : ''))).join('')}</div>${list.length > shown ? `<div class="loadMore"><button type="button" class="btn ghost" data-more>${t('loadMore')} (${num(list.length - shown)})</button></div>` : ''}`

// a phone photo can be 5–10 MB; WhatsApp only needs it readable
async function shrinkPhoto(file){
  try{
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
    return blob ? new File([blob], 'saleem-list-' + Date.now() + '.jpg', { type: 'image/jpeg' }) : file;
  }catch(e){ return file; }
}
async function addListFiles(files){
  for(const f of [...files].slice(0, 4 - listFiles.length)){
    if(!/^image\//.test(f.type)){ toast(t('listBad')); continue; }
    const small = await shrinkPhoto(f);
    listFiles.push({ file: small, url: URL.createObjectURL(small) });
  }
  if(parse().parts[0] === 'list') render();
}
async function sendList(){
  try{
    await navigator.share({ files: listFiles.map(x => x.file), text: t('listMsg') });
    toast(t('listSent'));
  }catch(e){ if(e && e.name === 'AbortError') return; window.open(wa(t('listMsg')), '_blank', 'noopener'); }
}

async function checkTrack(){
  const no = track.no.trim().toUpperCase(), last4 = track.last4.replace(/\D/g, '');
  const bad = [];
  if(!/^S-[A-Z0-9]{4,10}$/.test(no)) bad.push('no');
  if(last4.length !== 4) bad.push('last4');
  $$('#trackForm [data-field]').forEach(el => el.classList.toggle('bad', bad.includes(el.dataset.field)));
  if(bad.length) return;
  track = { no, last4, busy: true, res: null, err: '' }; rerenderTrack();
  try{
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(CONFIG.catalogUrl + (CONFIG.catalogUrl.includes('?') ? '&' : '?') + 'action=status&id=' + encodeURIComponent(no) + '&phone=' + last4, { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(timer);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    track.res = j.found ? j : null; track.err = j.found ? '' : 'trackNone';
  }catch(e){ track.err = 'trackFail'; }
  track.busy = false; rerenderTrack();
}

function totals(){
  let sub = 0, off = 0, priced = 0;
  cart.forEach(l => { const p = BYID.get(l.id), lp = linePrice(p, l.mode, l.qty); if(!lp) return; priced++; sub += lp.unit * l.qty; off += lp.unit * l.qty - lp.total; });
  const fee = S.delivery.on && S.delivery.feeIqd && cart.length ? S.delivery.feeIqd : 0;
  return { sub, off, fee, total: sub - off + fee, priced, all: priced === cart.length };
}

function setQty(id, mode, qty){
  id = String(id);
  const i = cart.findIndex(l => l.id === id && l.mode === mode);
  qty = Math.max(0, Math.min(99, qty));
  if(i < 0 && qty) cart.push({id, mode, qty});
  else if(i >= 0 && qty) cart[i].qty = qty;
  else if(i >= 0) cart.splice(i, 1);
  saveCart();
}

// the item's photo flies into the order tab, and the count gives a small bump
function flyToBag(id, from){
  const target = $$('[data-count]').find(el => el.offsetParent);
  if(!target) return;
  const bump = () => target.animate([{transform:'scale(1)'}, {transform:'scale(1.35)'}, {transform:'scale(1)'}], {duration: 320, easing: 'cubic-bezier(.16,1,.3,1)'});
  // the button may have been redrawn already: find the item's photo on screen by its id
  const seen = el => { const r = el.getBoundingClientRect(); return r.width && r.bottom > 0 && r.top < innerHeight; };
  const src = (from && from.isConnected && from.closest('[data-card]') && from.closest('[data-card]').querySelector('.ph'))
    || $$(`[data-card="${id}"] .ph`).find(seen) || (seen($('.pd .ph') || document.body) ? $('.pd .ph') : null);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !src || !src.getBoundingClientRect){ bump(); return; }
  const a = src.getBoundingClientRect(), b = target.getBoundingClientRect();
  if(!a.width){ bump(); return; }
  const p = BYID.get(String(id)), img = src.querySelector('img.in');
  const el = document.createElement('div'); el.className = 'fly';
  el.innerHTML = img ? `<img src="${esc(img.src)}" alt="">` : icon('d-' + DEPT[p.dept].icon);
  document.body.appendChild(el);
  const x0 = a.left + a.width / 2 - 28, y0 = a.top + a.height / 2 - 28, x1 = b.left + b.width / 2 - 28, y1 = b.top + b.height / 2 - 28;
  el.animate([
    { transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 1 },
    { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 60}px) scale(.8)`, opacity: 1, offset: .45 },
    { transform: `translate(${x1}px,${y1}px) scale(.3)`, opacity: .4 }
  ], { duration: 620, easing: 'cubic-bezier(.45,0,.2,1)' }).finished.then(() => { el.remove(); bump(); }, () => el.remove());
  el.style.left = '0'; el.style.top = '0';
}

function buildMessage(no, updates){
  const c = customer, pay = payments().find(m => m.key === c.payment), remind = S.reminders.on && c.remind && cart.some(l => l.mode === 'refill');
  const lines = [ '*' + t('msgHead') + '*', t('msgNo') + ': ' + no, ...(updates ? [t('msgUpdates') + ': ' + updates] : []), '',
    t('msgName') + ': ' + c.name.trim(), t('msgPhone') + ': ' + normPhone(c.phone), t('msgArea') + ': ' + c.area.trim() ];
  if(c.addr.trim()) lines.push(t('msgAddr') + ': ' + c.addr.trim());
  if(c.clinic.trim() && (cart.some(l => l.mode === 'quote') || c.isClinic)) lines.push(t('msgClinic') + ': ' + c.clinic.trim());
  if(pay) lines.push(t('msgPay') + ': ' + L(pay));

  cart.forEach(l => { const p = BYID.get(l.id), lp = linePrice(p, l.mode, l.qty), st = storeOf(p);
    lines.push(`• ${l.qty} × ${pName(p)} — ${modeLabel(l.mode)}${lp ? ' — ' + fmtIqd(lp.total) + (lp.off ? ` (−${lp.off}%)` : '') : ''} [#${p.id}${st ? ' · ' + L(st) : ''}]`); });
  const tt = totals();
  if(tt.priced){
    if(tt.fee) lines.push(t('msgDelivery') + ': ' + fmtIqd(tt.fee));

// monthly refills from the latest order that had any: due a refill period after it was
// sent. Shown from a week before until three weeks after, unless they're already in the order.
function runningLow(){
  const o = store.get('orders', []).find(x => x.lines && x.lines.some(l => l.mode === 'refill'));
  if(!o) return null;
  const lines = o.lines.filter(l => l.mode === 'refill' && BYID.has(String(l.id)) && !isOut(BYID.get(String(l.id))));
  if(!lines.length || lines.every(l => qtyOf(l.id, 'refill'))) return null;
  const left = Math.ceil((o.at + (S.reminders.days || 30) * 864e5 - Date.now()) / 864e5);
  if(left > 7 || left < -21) return null;
  return { left, lines, names: lines.map(l => pName(BYID.get(String(l.id)))).join(lang === 'ar' ? '، ' : ', ') };
}

}

document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if(a){
    // filter chips on a list keep your place; every other link starts at the top
    if(a.hasAttribute('data-quiet')){ e.preventDefault(); shown = CONFIG.pageSize; const y = window.scrollY; setHashQuietly(a.getAttribute('href')); render(); window.scrollTo(0, y); return; }
    freshNav = true;
    if(a.getAttribute('href') === location.hash){ e.preventDefault(); onRoute(); }
    return;
  }
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.choose){ openSheet(BYID.get(b.dataset.choose), b); return; }
  if(b.dataset.sheetAdd){ const [id, mode] = b.dataset.sheetAdd.split('|'); closeSheet(); setQty(id, mode, qtyOf(id, mode) + 1); refreshControls(id); flyToBag(id, sheetFrom); toast(addedMsg(BYID.get(id), mode)); return; }
  if(b.hasAttribute('data-sheet-close')){ closeSheet(); return; }
  if(b.dataset.add){ const [id, mode] = b.dataset.add.split('|'); setQty(id, mode, 1); refreshControls(id); flyToBag(id, b); toast(addedMsg(BYID.get(id), mode)); return; }
  const line = b.closest('[data-line]');
  if(line && (b.hasAttribute('data-inc') || b.hasAttribute('data-dec') || b.hasAttribute('data-rm'))){
    const [id, mode] = line.dataset.line.split('|'), q = qtyOf(id, mode), at = cart.findIndex(l => l.id === id && l.mode === mode);
    const to = b.hasAttribute('data-rm') ? 0 : q + (b.hasAttribute('data-inc') ? 1 : -1);
    setQty(id, mode, to);
    // taking a line out can be undone from the toast, back in the same place
    if(!to && q) toast(t('removed', {p: pName(BYID.get(id))}), () => { cart.splice(Math.min(at, cart.length), 0, {id, mode, qty: q}); saveCart(); });
    if(parse().parts[0] === 'order'){ const y = window.scrollY; render(); window.scrollTo(0, y); } else refreshControls(id);
    return;
  }
  if(b.hasAttribute('data-pinc') || b.hasAttribute('data-pdec')){
    const el = $('[data-pqty]'); el.textContent = Math.max(1, Math.min(99, +el.textContent + (b.hasAttribute('data-pinc') ? 1 : -1))); return;
  }
  if(b.hasAttribute('data-padd') || b.hasAttribute('data-sticky-add')){ addFromProduct(); flyToBag($('[data-product]').dataset.product, null); return; }
  if(b.hasAttribute('data-share')){ share(); return; }
  if(b.hasAttribute('data-list-send')){ sendList(); return; }
  if(b.dataset.trackPick){ track.no = b.dataset.trackPick; const f = $('#trackForm'); track.last4 = f ? f.last4.value : track.last4; checkTrack(); return; }
  if(b.dataset.listRm !== undefined){ const [x] = listFiles.splice(+b.dataset.listRm, 1); if(x) URL.revokeObjectURL(x.url); render(); return; }
  if(b.hasAttribute('data-install')){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; paintInstall(); }); } return; }
  if(b.hasAttribute('data-install-hide')){ store.set('installHidden', Date.now() + 30 * 864e5); paintInstall(); return; }
  if(b.hasAttribute('data-undo')){
    const fn = undoFn; hideToast(); if(!fn) return; fn();
    if(parse().parts[0] === 'order'){ const y = window.scrollY; render(); window.scrollTo(0, y); } else $$('[data-card]').forEach(c => refreshControls(c.dataset.card));
    return;
  }
  if(b.dataset.kit){ const k = kitById(b.dataset.kit); if(k){ addKit(k); } return; }
  if(b.hasAttribute('data-refill-now')){ const low = runningLow(); if(low){ const n = addLines(low.lines); freshNav = true; location.hash = '#/order'; setTimeout(() => toast(t('againDone', {n})), 50); } return; }
  if(b.hasAttribute('data-again')){ const o = lastOrder(); if(o){ const n = addLines(o.lines); freshNav = true; location.hash = '#/order'; setTimeout(() => toast(t('againDone', {n})), 50); } return; }
  if(b.dataset.bnav){ const tr = $('#bTrack'); goBanner(Math.round(Math.abs(tr.scrollLeft) / tr.clientWidth) + Number(b.dataset.bnav)); return; }
  if(b.dataset.bdot){ goBanner(Number(b.dataset.bdot)); return; }
  if(b.dataset.filter !== undefined){ updateListQs({ show: b.dataset.filter }); return; }
  if(b.hasAttribute('data-more')){ shown += CONFIG.pageSize; shownMemo[location.hash] = shown; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(b.hasAttribute('data-clear')){ setSearch(''); const i = b.parentElement.querySelector('input'); i && i.focus(); return; }
  if(b.hasAttribute('data-new-order')){
    // clearing the list asks first, in place
    if(!b.hasAttribute('data-sure')){ confirmNew = true; render(); const y = $('[data-sure]'); y && y.focus(); return; }
    cart = []; sent = null; store.set('sent', null); confirmNew = editingSent = false; saveCart(); render(); window.scrollTo(0, 0); return;
  }
  if(b.hasAttribute('data-new-cancel')){ confirmNew = false; render(); const n = $('[data-new-order]'); n && n.focus(); return; }
  if(b.hasAttribute('data-back-order')){ editingSent = true; confirmNew = false; render(); window.scrollTo(0, 0); return; }
  if(b.hasAttribute('data-show-sent')){ editingSent = false; render(); window.scrollTo(0, 0); return; }
  if(b.id === 'theme'){ store.set('theme', darkNow() ? 'light' : 'dark'); applyTheme(); return; }
  if(b.id === 'lang'){ lang = lang === 'ar' ? 'en' : 'ar'; store.set('lang', lang); applyLang(); const y = window.scrollY; render(); window.scrollTo(0, y); }
});

function updateListQs(patch){
  const { parts, qs } = parse();
  for(const k in patch){ if(patch[k]) qs.set(k, patch[k]); else qs.delete(k); }
  shown = CONFIG.pageSize;
  const s = qs.toString(), y = window.scrollY;
  setHashQuietly('#/' + parts.map(encodeURIComponent).join('/') + (s ? '?' + s : ''));
  render(); window.scrollTo(0, y);
}

document.addEventListener('change', e => {
  if(e.target.matches('[data-sort]')) updateListQs({ sort: e.target.value });
  if(e.target.matches('[data-mode]')){
    const [id, mode] = e.target.closest('[data-line]').dataset.line.split('|'), to = e.target.value, q = qtyOf(id, mode), had = qtyOf(id, to);
    setQty(id, mode, 0); setQty(id, to, had + q);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if(had) toast(t('merged', {m: modeLabel(to)}));
  }
  if(e.target.matches('[data-list-file]')){ addListFiles(e.target.files); return; }
  if(e.target.matches('[data-product] input[name=mode]')){
    const el = $('[data-sticky-sub]'), p = BYID.get($('[data-product]').dataset.product); if(el) el.textContent = stickySub(p, e.target.value);
  }
  if(e.target.matches('[data-kit-item]')){
    const k = kitById(parse().parts[1]), btn = $('[data-kit-btn]');
    if(e.target.checked) kitSkip.delete(e.target.dataset.kitItem); else kitSkip.add(e.target.dataset.kitItem);
    if(k && btn) btn.outerHTML = kitButton(k);
  }
  if(e.target.closest('#orderForm') && ['payment', 'remind', 'isClinic'].includes(e.target.name)){
    const f = e.target; customer[f.name] = f.type === 'checkbox' ? f.checked : f.value; store.set('customer', customer);
    if(f.name === 'isClinic'){ const y = window.scrollY; render(); window.scrollTo(0, y); }
  }
});

/* search: typing anywhere switches to the Search tab and updates results in place */
function syncSearchBoxes(except){
  const q = parse().parts[0] === 'search' ? (parse().qs.get('q') || '') : '';
  [$('#q'), ...$$('[data-search]')].forEach(i => {
    if(i !== except) i.value = q;
    i.closest('.search').classList.toggle('has', !!i.value);
  });
}
function setSearch(q, from){
  const on = parse().parts[0] === 'search';
  const h = withQs('#/search', { q: q || null });
  if(!on){ freshNav = true; searchFocus = !!from; location.hash = h; return; }
  shown = CONFIG.pageSize;
  setHashQuietly(h);
  if(!$('#results')){ render(); return; }
  $('#results').innerHTML = searchResults(q);
  syncSearchBoxes(from);
  document.title = (q ? t('srchFor', {q}) : t('srchTitle')) + ' · ' + t('_title');
}
document.addEventListener('input', e => {
  if(e.target.matches('#q, [data-search]')){ e.target.closest('.search').classList.toggle('has', !!e.target.value); setSearch(e.target.value, e.target); }
  if(e.target.closest('#orderForm') && e.target.type !== 'checkbox' && e.target.type !== 'radio'){
    const f = e.target; customer[f.name] = f.value; store.set('customer', customer);
    const wrap = f.closest('.field'); if(wrap) wrap.classList.remove('bad');
  }
});
document.addEventListener('submit', e => {
  if(e.target.matches('[data-search-form]')){ e.preventDefault(); const i = e.target.querySelector('input'); i.blur(); setSearch(i.value); return; }
  if(e.target.id === 'trackForm'){
    e.preventDefault(); const f = e.target;
    track.no = f.no.value; track.last4 = f.last4.value; checkTrack(); return;
  }
  if(e.target.id === 'orderForm'){
    e.preventDefault();
    const bad = [];
    if(customer.name.trim().length < 2) bad.push('name');
    if(!phoneOk(customer.phone)) bad.push('phone');
    if(!customer.area.trim()) bad.push('area');
    $$('#orderForm [data-field]').forEach(el => el.classList.toggle('bad', bad.includes(el.dataset.field)));
    if(bad.length){ const first = $(`#orderForm [name=${bad[0]}]`); first.focus(); return; }
    // the same list sent again keeps its number (the Sheet ignores a repeat); a changed list
    // is a new order that says which one it updates
    const same = sent && sent.sig === cartSig(), no = same ? sent.no : newOrderNo();
    const url = wa(buildMessage(no, sent && !same ? sent.no : ''));
    window.open(url, '_blank', 'noopener');
    if(!same){ logOrder(no); saveOrderLocally(no); }
    sent = { no, at: Date.now(), wa: url, sig: cartSig(), lines: cart.map(l => ({ id: l.id, mode: l.mode, qty: l.qty })) };
    store.set('sent', sent); editingSent = confirmNew = false;
    render(); window.scrollTo(0, 0);
  }
});
// "/" jumps to search on desktop
document.addEventListener('keydown', e => {
  if(e.key === '/' && !e.target.closest('input,textarea,select')){ e.preventDefault(); const i = $('#q'); if(i.offsetParent) i.focus(); else location.hash = '#/search'; }
});

let stickyObs = null;
function afterRender(){
  // opening the Search tab on a phone puts the cursor straight in the box
  if(parse().parts[0] === 'search' && freshNav && !searchFocus && !parse().qs.get('q')){ const i = $('.mSearch input'); if(i && i.offsetParent) setTimeout(() => i.focus(), 50); }
  startBanners();
  $$('.ph img').forEach(i => { if(i.complete && i.naturalWidth) i.classList.add('in'); });
  // the add-to-order bar is up on phones whenever the main button is off screen
  if(stickyObs){ stickyObs.disconnect(); stickyObs = null; }
  const btn = $('[data-padd]'), bar = $('#stickyBuy');
  if(btn && bar && 'IntersectionObserver' in window){
    const tabs = $('#tabs'), below = tabs && getComputedStyle(tabs).position === 'fixed' ? tabs.offsetHeight : 0;
    stickyObs = new IntersectionObserver(([en]) => bar.classList.toggle('on', en.intersectionRatio < 1), { rootMargin: `0px 0px -${below}px 0px`, threshold: [0, 1] });
    stickyObs.observe(btn);
  }
}

// light or dark: the visitor's pick if they made one, else the phone's setting
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const darkNow = () => { const th = store.get('theme', ''); return th ? th === 'dark' : sysDark.matches; };
function applyTheme(){
  const th = store.get('theme', '');
  if(th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
  const dark = darkNow(), btn = $('#theme');
  $('#themeColor').content = dark ? '#0B1622' : '#003260';
  btn.innerHTML = icon(dark ? 'i-sun' : 'i-moon'); btn.setAttribute('aria-label', t(dark ? 'themeLight' : 'themeDark')); btn.title = t(dark ? 'themeLight' : 'themeDark');
}
sysDark.addEventListener && sysDark.addEventListener('change', applyTheme);
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#skip').textContent = t('skip');
  $('#logoSub').textContent = t('logoSub');
  $('#searchLbl').textContent = t('search');
  $('#q').placeholder = t('search');
  $('#lang').textContent = t('lang');
  applyTheme();
  $('#orderPill').textContent = t('orderPill');
  $('#footText').textContent = t('foot');
  const fw = $('#footWa'); fw.innerHTML = esc(t('footWa')) + '<bdi dir="ltr">' + esc(CONFIG.bizPhone) + '</bdi>'; fw.href = wa(t('askMsg'));
  if(S){
    previewBar();
    $('#footDelivery').textContent = S.delivery.on ? (L(S.delivery)) + ' · ' + LF(S.delivery, 'note') : '';
    $('#footPays').innerHTML = payments().map(m => `<span>${esc(L(m))}</span>`).join('');
  }
}

function previewBar(){
  const bar = $('#previewBar');
  bar.hidden = SOURCE !== 'draft';
  bar.innerHTML = `${icon('i-quote')}<span>${t('previewing')}</span><a href="${location.pathname}${location.hash}">${t('previewExit')}</a>`;
}

if(document.startViewTransition) document.documentElement.classList.add('vt');
// offline copy of the shop (only when served over http(s); never for a preview)
if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !new URLSearchParams(location.search).has('preview'))
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
const previewing = new URLSearchParams(location.search).has('preview');
applyLang();
CAT.load({
  preview: previewing,
  // the Sheet answered after we'd drawn the remembered copy: redraw in place
  onUpdate(cat){ setCatalog(cat); cart = loadCart(); paintCounts(); applyLang(); const y = window.scrollY; render(); window.scrollTo(0, y); },
}).then(cat => {
  setCatalog(cat);
  cart = loadCart();
  // a preview never touches the real basket
  if(previewing) store.set = () => {};
  paintCounts(); applyLang();
  freshNav = true; onRoute();
});
</script>
