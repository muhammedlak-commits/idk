<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Saleem Supplies — buying list</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* INTERNAL — the procurement view of data/products.js. Not part of the public site. */
:root{--navy:#003260;--navy2:#002444;--blue:#1C75BC;--or:#F47B20;--ink:#10222F;--mut:#58708A;--line:#E1E8EF;--pap:#F6F9FC;
  --t1:#C0392B;--t1b:#FBEBE9;--t2:#1C75BC;--t2b:#EAF3FB;--t3:#5B7288;--t3b:#EEF2F6}
*{box-sizing:border-box}
body{margin:0;background:#EDF2F7;color:var(--ink);font:500 14px/1.55 Montserrat,system-ui,sans-serif;min-width:320px}
html[lang=ar] body{font-family:Cairo,system-ui,sans-serif;font-weight:600}
button,input,select{font:inherit;color:inherit}
.wrap{width:min(100% - 32px,1280px);margin-inline:auto}
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.bar img{height:30px}
.bar strong{color:var(--navy);font-size:14px}
.bar .sp{flex:1}
.btn{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}
.hero{background:linear-gradient(155deg,#002444,#003260 45%,#00558E);color:#fff;padding:28px 0 24px}
.hero small{color:#7FC0F0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero h1{margin:6px 0 6px;font-size:24px}
.hero p{margin:0;opacity:.9;max-width:80ch}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px}
.stats b{display:block;font:800 22px Montserrat,sans-serif}
.stats span{font-size:12px;opacity:.75;font-weight:700}
.tools{position:sticky;top:60px;z-index:9;background:#EDF2F7;padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.tools select,.tools input{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:13px}
.tools input{flex:1;min-width:180px}
.note{background:#fff;border-radius:10px;padding:11px 14px;margin:6px 0 14px;font-size:13px;color:var(--mut);border-inline-start:4px solid var(--blue)}
.tsec{margin-bottom:18px}
.thead{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:10px;border-top:5px solid}
.t1 .thead{border-color:var(--t1)}.t2 .thead{border-color:var(--t2)}.t3 .thead{border-color:var(--t3)}
.tg{display:inline-block;font:800 11px Montserrat,sans-serif;letter-spacing:.08em;padding:3px 9px;border-radius:5px;margin-bottom:6px}
.t1 .tg{background:var(--t1b);color:var(--t1)}.t2 .tg{background:var(--t2b);color:var(--t2)}.t3 .tg{background:var(--t3b);color:var(--t3)}
.thead h2{margin:0 0 3px;font-size:18px;color:var(--navy)}
.thead .cnt{float:inline-end;font:800 18px Montserrat,sans-serif;color:var(--navy)}
.thead p{margin:0 0 8px;color:var(--mut);font-size:13px}
.thead .test{background:var(--pap);border-radius:8px;padding:8px 11px;font-size:12.5px;margin-bottom:6px}
.thead .rule{font-size:12.5px;font-weight:800}
.t1 .rule{color:var(--t1)}.t2 .rule{color:var(--t2)}.t3 .rule{color:var(--t3)}
.grp{background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden}
.grp h3{margin:0;padding:9px 16px;background:var(--pap);border-bottom:1px solid var(--line);font-size:13.5px;color:var(--navy)}
.row{display:grid;grid-template-columns:96px minmax(180px,1.3fr) 1fr 1fr 2fr;gap:14px;align-items:start;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.hd{padding:7px 16px;background:#FBFDFF;font:800 10.5px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
html[lang=ar] .row.hd{font-family:Cairo,sans-serif;letter-spacing:0;font-size:12px}
.ph{display:block;position:relative;width:96px;height:68px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(145deg,#F6F9FC,#E8F0F7);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ph.noimg img{display:none}
.ph span{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);font-size:11px;font-weight:800}
.nm b{display:block;font-size:14px}
.nm small{color:var(--mut);font-size:12.5px}
.nm em{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.g-doctor{background:#EAF3FB;color:#00447A}.g-nursing{background:#E7F5ED;color:#0F6B3D}.g-physio{background:#FEF2E8;color:#B4560F}
.g-lab{background:#F3EDF9;color:#5B3A85}.g-direct{background:#EEF2F6;color:#4A6478}
.m-rent{background:#FEF2E8;color:#D9611A}.m-refill{background:#E7F5ED;color:#0F6B3D}.m-b2b{background:#F3EDF9;color:#5B3A85}
.why{color:var(--mut);font-size:13px}
.st-out{background:#FBEBE9;color:#C0392B}.tag.price{background:#EEF2F6;color:var(--navy);font-family:Montserrat,sans-serif}
.lbl{display:none}
.empty{background:#fff;border-radius:12px;padding:40px;text-align:center;color:var(--mut)}
footer{text-align:center;font-size:12px;color:var(--mut);padding:24px 0 40px}
@media(max-width:820px){
  .row.hd{display:none}
  .row{grid-template-columns:84px 1fr;gap:6px 12px}
  .row>.ph{grid-row:span 3;width:84px;height:64px}
  .row>.why{grid-column:1/-1}
  .lbl{display:inline;color:var(--mut);font-size:11px;font-weight:800;margin-inline-end:4px}
  .tools{position:static}
  .bar strong{display:none}
}
@media print{
  .bar,.tools,.note.photo{display:none}
  body{background:#fff}
  .hero{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grp,.thead{break-inside:avoid-page}
  .row{break-inside:avoid}
}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><img src="assets/logo-saleem.png" alt="Saleem"><strong id="barT"></strong><span class="sp"></span><button class="btn" id="print" type="button"></button><button class="btn" id="lang" type="button"></button></div></header>
<section class="hero"><div class="wrap"><small id="kk"></small><h1 id="h1"></h1><p id="hp"></p><div class="stats" id="stats"></div></div></section>
<div class="wrap">
  <div class="tools"><div class="seg" id="tiers" role="group"></div><select id="dept"></select><input type="search" id="q" autocomplete="off"></div>
  <p class="note photo" id="photoNote"></p>
  <p class="note" id="b2bNote"></p>
  <div id="list"></div>
</div>
<footer><span id="foot"></span></footer>

<script src="config.js"></script>
<script src="data/products.js"></script>
<script src="js/catalog.js"></script>
<script>
const DEPTS = SaleemCatalog.bundled.departments;
let P = [];
const DEPT = Object.fromEntries(DEPTS.map(d => [d.key, d]));
const T = {
  en: { _title:'Saleem Supplies — buying list', bar:'Saleem Supplies · internal', lang:'العربية', print:'Print', kk:'Saleem Store · Procurement reference',
    h1:'Supplies list by clinical priority', hp:'Every item sits in exactly one of three tiers, decided by one question: <b>does the care plan fail without it?</b> Not by margin, not by popularity.',
    total:'Total items', depts:'Departments', all:'All tiers', allD:'All departments', q:'Search items…',
    photo:'📷 Photos are web references from an image search on the item name — click one to see more results. Brands and models will differ from stock.',
    b2b:'Items marked <b>B2B only</b> sit under “For Clinics” in the shop and sell by quote — they never sit in store stock. Hospital equipment (autoclaves, crash carts) is not on this list at all.',
    hPhoto:'Photo', hItem:'Item', hTrig:'Triggered by', hModel:'Model', hWhy:'Why this tier', none:'No items match.',
    tiers:{1:['Mandatory — the care plan depends on it','Items a doctor or nurse needs the moment a visit generates the need','The test: if this runs out, does an existing patient’s care plan break?','▸ Needs 3–4 weeks of safety stock and at least two suppliers'],
           2:['Useful — worth stocking','Improves comfort, safety or independence, but recovery doesn’t fail without it','The test: does it improve the outcome or comfort, but has an alternative or isn’t critical?','▸ Light safety stock — one supplier is acceptable'],
           3:['Bonus — add later','Comfort, wellness and adjacent goods — real revenue, no role in the care plan','The test: if we never sold this, would any patient be affected?','▸ No pre-stock — order on demand or drop-ship from the supplier']},
    out:'Out of stock', mo:'month',
    svc:{doctor:'Doctor visit',nursing:'Nursing visit',physio:'Physiotherapy',lab:'Lab visit',direct:'Direct order'}, m:{rent:'Rentable',refill:'Subscription',b2b:'B2B only'},
    foot:'Almostaqbal Alsaleem for Healthcare Services LLC — internal procurement reference. Generated from data/products.js.' },
  ar: { _title:'مستلزمات سليم — قائمة المشتريات', bar:'مستلزمات سليم · داخلي', lang:'English', print:'طباعة', kk:'متجر سليم · مرجع المشتريات',
    h1:'قائمة المستلزمات مرتّبة حسب الأهمية السريرية', hp:'كل صنف مرتّب بفئة واحدة من ثلاث، حسب سؤال واحد فقط: <b>هل تتعطّل خطة العلاج بلا هذا الصنف؟</b> ما بالهامش، وما بالشعبية.',
    total:'مجموع الأصناف', depts:'الأقسام', all:'كل الفئات', allD:'كل الأقسام', q:'ابحث عن صنف…',
    photo:'📷 الصور مراجع من بحث صور على اسم الصنف — اضغط على أي صورة لنتائج أكثر. العلامة والموديل راح يختلفون عن المخزون.',
    b2b:'الأصناف المعلّمة <b>جملة فقط</b> موجودة تحت «للعيادات» بالمتجر وتنباع بعرض سعر — ما تدخل مخزون المتجر. معدات المستشفيات (أجهزة التعقيم، عربات الطوارئ) مو بهذي القائمة أصلاً.',
    hPhoto:'صورة', hItem:'الصنف', hTrig:'يطلبه', hModel:'طريقة البيع', hWhy:'ليش بهذي الفئة', none:'ماكو أصناف مطابقة.',
    tiers:{1:['إلزامي — خطة العلاج تعتمد عليه','الأصناف اللي الطبيب أو الممرض يحتاجها فوراً بعد الزيارة','سؤال الفرز: إذا خلص من المخزن، هل تتعطّل خطة علاج مريض موجود؟','▸ لازم مخزون أمان (3–4 أسابيع) ومورّدين اثنين على الأقل'],
           2:['مفيد — يضاف للقائمة','يحسّن الراحة أو السلامة أو الاستقلالية، لكن التعافي ما يفشل بلاه','سؤال الفرز: يحسّن النتيجة أو الراحة، لكن في بديل أو ما هو حرج؟','▸ مخزون خفيف — مورّد واحد يكفي'],
           3:['إضافي — نضيفه لاحقاً','راحة وعافية وسلع مجاورة — إيراد إضافي بلا دور بخطة الرعاية','سؤال الفرز: لو ما بعناه أبداً، هل يتأثر أي مريض؟','▸ بلا مخزون مسبق — يُطلب عند الحاجة أو بالتوصيل المباشر من المورّد']},
    out:'غير متوفر', mo:'شهر',
    svc:{doctor:'زيارة طبيب',nursing:'تمريض',physio:'علاج طبيعي',lab:'مختبر',direct:'طلب مباشر'}, m:{rent:'إيجار',refill:'اشتراك',b2b:'جملة فقط'},
    foot:'شركة المستقبل السليم للخدمات الصحية المحدودة — مرجع داخلي للمشتريات. مولّد من data/products.js.' },
};
let lang = 'en', tier = 0, dept = '', q = '';
try{ lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('saleem-supplies:lang') || 'en'; }catch(e){}
if(lang !== 'ar') lang = 'en';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const t = k => T[lang][k];
const L = o => lang === 'ar' ? o.ar : o.en;
const norm = s => String(s).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
document.addEventListener('error', e => { if(e.target.tagName === 'IMG'){ const ph = e.target.closest('.ph'); if(ph) ph.classList.add('noimg'); } }, true);

function row(p){
  const sub = DEPT[p.dept].subs.find(s => s.key === p.sub), qy = encodeURIComponent(p.en + ' medical supply product white background');
  const models = (['rent', 'refill', 'b2b'].filter(k => p[k]).map(k => `<span class="tag m-${k}">${t('m')[k]}</span>`).join('') || '<span style="color:#c3cfda">—</span>')
    + (p.status === 'out' ? `<span class="tag st-out">${t('out')}</span>` : '')
    + (p.price || p.rentPrice ? `<span class="tag price">${[p.price && p.price.toLocaleString('en-US'), p.rentPrice && p.rentPrice.toLocaleString('en-US') + ' / ' + t('mo')].filter(Boolean).join(' · ')} IQD</span>` : '');
  const thumb = p.img || ('https://tse1.mm.bing.net/th?q=' + qy + '&w=240&h=170&c=7&rs=1&p=0&dpr=1.5&pid=1.7&mkt=en-US&adlt=strict');
  return `<div class="row">
    <a class="ph" href="https://www.bing.com/images/search?q=${qy}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.en)}"><span>#${p.id}</span><img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>
    <div class="nm"><b>${esc(L(p))}</b><small>${esc(lang === 'ar' ? p.en : p.ar)}</small><em>${esc(L(sub))} · #${p.id}</em></div>
    <div class="tags"><span class="lbl">${t('hTrig')}:</span>${p.services.map(s => `<span class="tag g-${s}">${t('svc')[s]}</span>`).join('')}</div>
    <div class="tags"><span class="lbl">${t('hModel')}:</span>${models}</div>
    <div class="why">${esc(lang === 'ar' ? p.whyAr : p.whyEn)}</div></div>`;
}

function render(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.title = t('_title');
  $('#barT').textContent = t('bar'); $('#lang').textContent = t('lang'); $('#print').textContent = t('print');
  $('#kk').textContent = t('kk'); $('#h1').textContent = t('h1'); $('#hp').innerHTML = t('hp');
  $('#photoNote').textContent = t('photo'); $('#b2bNote').innerHTML = t('b2b'); $('#foot').textContent = t('foot'); $('#q').placeholder = t('q');
  $('#stats').innerHTML = [[P.length, t('total')], ...[1,2,3].map(n => [P.filter(p => p.tier === n).length, 'Tier ' + n]), [DEPTS.length, t('depts')]].map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
  $('#tiers').innerHTML = [0,1,2,3].map(n => `<button type="button" data-tier="${n}" aria-pressed="${tier === n}">${n ? 'Tier ' + n : t('all')}</button>`).join('');
  $('#dept').innerHTML = `<option value="">${t('allD')}</option>` + DEPTS.map(d => `<option value="${d.key}" ${dept === d.key ? 'selected' : ''}>${esc(L(d))}</option>`).join('');
  list();
}
function list(){
  const nq = norm(q.trim());
  const items = P.filter(p => (!tier || p.tier === tier) && (!dept || p.dept === dept) && (!nq || norm(p.en + ' ' + p.ar).includes(nq)));
  const hd = `<div class="row hd"><span>${t('hPhoto')}</span><span>${t('hItem')}</span><span>${t('hTrig')}</span><span>${t('hModel')}</span><span>${t('hWhy')}</span></div>`;
  const out = [1,2,3].map(n => {
    const inTier = items.filter(p => p.tier === n); if(!inTier.length) return '';
    const [h, sub, test, rule] = t('tiers')[n];
    const groups = DEPTS.map(d => { const g = inTier.filter(p => p.dept === d.key); return g.length ? `<div class="grp"><h3>${esc(L(d))} · ${g.length}</h3>${hd}${g.map(row).join('')}</div>` : ''; }).join('');
    return `<section class="tsec t${n}"><div class="thead"><span class="cnt">${inTier.length}</span><span class="tg">TIER ${n}</span><h2>${h}</h2><p>${sub}</p><div class="test">${test}</div><div class="rule">${rule}</div></div>${groups}</section>`;
  }).join('');
  $('#list').innerHTML = out || `<div class="empty">${t('none')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tier]'); if(b){ tier = +b.dataset.tier; render(); }
  if(e.target.id === 'lang'){ lang = lang === 'ar' ? 'en' : 'ar'; try{ localStorage.setItem('saleem-supplies:lang', lang); }catch(err){} render(); }
  if(e.target.id === 'print') window.print();
});
$('#dept').addEventListener('change', e => { dept = e.target.value; list(); });
$('#q').addEventListener('input', e => { q = e.target.value; list(); });
// the same list the shop shows — the Google Sheet when one is connected. A row whose
// department or section doesn't exist (a typo in the Sheet) is left out rather than breaking the page.
SaleemCatalog.load().then(cat => { P = cat.products.filter(p => DEPT[p.dept] && DEPT[p.dept].subs.some(s => s.key === p.sub)); render(); });
</script>
</body>
</html>
