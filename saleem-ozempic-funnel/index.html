<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامج Ozempic® — سليم</title>
<meta name="description" content="برنامج Ozempic® بإشراف طبي كامل من سليم: تقييم أونلاين بدقيقتين، مكالمة طبيب خلال ٢٤ ساعة، الدواء الأصلي يوصلك للبيت، ومتابعة شهرية.">
<meta property="og:title" content="الوزن مو مسألة إرادة بس.">
<meta property="og:description" content="برنامج Ozempic® بإشراف طبي كامل — شوف إذا إنت مؤهل خلال دقيقتين.">
<meta property="og:image" content="assets/ozempic-hero.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo-saleem.png">
<link rel="preload" as="image" href="assets/ozempic-hero.webp">
<style>
:root{
  --navy:#0E3A66; --navy-2:#0A2540; --teal:#0E9E8E; --teal-dk:#0A7A6D; --tdeep:#0A5A50;
  --tsoft:#EAF7F5; --tline:#D3EEE9; --orange:#F98C41;
  --bg:#EEF3F8; --white:#fff; --ink:#0F2438; --muted:#5E7488; --line:#E3EBF2;
  --green:#158A5E; --amber:#C9871B; --slate:#7B8699;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Cairo','Manrope',system-ui,sans-serif;
  --r:18px; --r-lg:26px;
  --shadow:0 4px 24px rgba(10,46,87,.08);
  --shadow-lg:0 18px 50px rgba(10,46,87,.16);
  --bar-h:84px; --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden;padding-bottom:var(--bar-h)}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:20px}
.sec{padding:64px 0}
.sec-sm{padding:44px 0}
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--disp);line-height:1.25;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(30px,7.2vw,52px)}
h2{font-size:clamp(25px,5.4vw,40px)}
h3{font-size:clamp(18px,3.4vw,22px)}
.lead{font-size:clamp(16px,4vw,20px);color:var(--muted);font-weight:400}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--teal);margin-bottom:12px}
.num{font-variant-numeric:tabular-nums}
[dir=ltr] .rtl-only{display:none!important}
[dir=rtl] .ltr-only{display:none!important}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,var(--teal),var(--teal-dk));color:#fff;
  font-family:var(--disp);font-weight:800;font-size:clamp(16px,4.2vw,19px);
  padding:17px 30px;border-radius:100px;width:100%;
  box-shadow:0 8px 24px rgba(14,158,142,.32);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.97)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(14,158,142,.42)}}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
.btn .arw{width:.85em;height:.85em;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .btn .arw{transform:scaleX(-1)}
.btn-wide{max-width:440px}
.btn.navy{background:linear-gradient(180deg,#164B80,var(--navy));box-shadow:0 8px 24px rgba(14,58,102,.3)}
.btn[disabled]{opacity:.55;pointer-events:none}

/* ---------- co-brand ---------- */
.cobrand{background:var(--white);border-bottom:1px solid var(--line);padding:11px 0;position:sticky;top:0;z-index:40}
.cobrand .wrap{display:flex;align-items:center;justify-content:center;gap:18px;position:relative;min-height:46px}
.lg{width:auto;object-fit:contain;flex:none}
.lg-saleem{height:24px}
.lg-novo{height:40px}
@media(max-width:430px){.cobrand .wrap{gap:12px}.lg-saleem{height:21px}.lg-novo{height:34px}}
.cobrand .x{color:var(--muted);font-size:12px;font-weight:600}
.lang{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:5px 13px;
  font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--navy);line-height:1.4;min-width:38px}
.lang:hover{border-color:var(--teal)}
.cobrand .lang{position:absolute;inset-inline-end:20px;top:50%;transform:translateY(-50%)}
.qhead .lang{padding:6px 10px;min-width:34px}
@media(max-width:400px){.qhead .chip{display:none}}

/* ---------- hero ---------- */
.hero{background:linear-gradient(165deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-160px;inset-inline-start:-120px;width:460px;height:460px;
  background:radial-gradient(circle,rgba(14,158,142,.3),transparent 68%);pointer-events:none}
.hero-grid{display:grid;gap:0;position:relative;z-index:2}
.hero-copy{padding:34px 20px 34px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(14,158,142,.18);color:#8FE6DA;
  font-weight:700;font-size:13.5px;padding:8px 15px;border-radius:100px;margin-bottom:18px;border:1px solid rgba(14,158,142,.4)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
.hero h1{margin-bottom:14px}
h1 .hl{color:#5FD9C9;position:relative;white-space:nowrap}
h1 .hl::after{content:"";position:absolute;inset-inline:-2px;bottom:.04em;height:.2em;background:rgba(249,140,65,.5);border-radius:3px;z-index:-1}
.hero .lead{color:#CFE0EE;margin-bottom:22px;max-width:34ch}
.freeline{margin-top:13px;font-size:13.5px;font-weight:600;color:#9FE8DB;max-width:38ch;line-height:1.6}
.freeline b{color:#fff;font-weight:800}
.microrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.micro{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#E4EEF8}
.micro .ic{width:15px;height:15px;color:#5FD9C9}
.hero-art{padding:6px 20px 38px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.prodcard{background:#fff;border-radius:16px;padding:12px;box-shadow:0 16px 38px rgba(4,25,50,.34)}
.prodcard img{border-radius:6px}
.prodcard.hero-shot img{width:min(300px,74vw)}
.prodcard.hero-hand{display:none}
@media(min-width:900px){.prodcard.hero-hand{display:block}.prodcard.hero-hand img{width:200px}}
@media(min-width:900px){
  .hero-grid{max-width:1180px;margin-inline:auto;grid-template-columns:1.02fr .98fr;align-items:center;min-height:560px;gap:40px;padding-inline:24px}
  .hero-copy{padding:66px 0}
  .hero-art{padding:0;flex-direction:column}
  .prodcard.hero-shot img{width:330px}
}

/* ---------- doses ---------- */
.doses{background:linear-gradient(180deg,#0C3159,var(--navy-2));color:#fff;position:relative;overflow:hidden}
.doses::before{content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
  background:radial-gradient(ellipse at 78% 10%,rgba(14,158,142,.22),transparent 58%),
             radial-gradient(ellipse at 12% 90%,rgba(46,120,200,.2),transparent 58%)}
.doses .wrap{position:relative;z-index:2}
.doses .head{margin-bottom:30px}
.doses .lead{color:#B9CDE4}
.dosefig{max-width:620px;margin:0 auto;background:#fff;border-radius:var(--r-lg);padding:20px 18px 16px;box-shadow:var(--shadow-lg)}
.dosefig img{width:100%;border-radius:10px}
.dosefig figcaption{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.dosecta{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:13px}
.dose-note{font-size:14.5px;color:#B9CDE4;text-align:center;max-width:40ch;line-height:1.6}
.dose-note b{color:#fff;font-weight:700}

/* ---------- badges ---------- */
.badges{background:var(--white);border-block:1px solid var(--line)}
.badges .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:6px 2px}
.badge .bi{width:46px;height:46px;margin:0 auto 9px;border-radius:14px;background:var(--tsoft);border:1px solid var(--tline);
  display:grid;place-items:center;color:var(--teal-dk)}
.badge .bi .ic{width:23px;height:23px}
.badge span{font-size:12px;font-weight:700;color:var(--navy);line-height:1.35;display:block}
@media(min-width:700px){.badge .bi{width:58px;height:58px}.badge .bi .ic{width:28px;height:28px}.badge span{font-size:14px}}

/* ---------- section head ---------- */
.head{text-align:center;max-width:640px;margin:0 auto 40px}
.head .lead{margin-top:12px}

/* ---------- journey / chart ---------- */
.journey{background:var(--white)}
.chartcard{max-width:620px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px 14px;box-shadow:var(--shadow)}
.chart-h{font-weight:700;font-size:14px;color:var(--navy);line-height:1.7;margin:0 4px 12px;text-align:center}
.chart-h b{color:var(--teal-dk);font-weight:800}
svg.chart{width:100%;height:auto;display:block;direction:ltr}
svg.chart .tap{cursor:pointer}
.chart-pick{text-align:center;font-size:14px;color:var(--ink);margin-top:12px;min-height:20px;font-weight:600}
.chart-pick b{color:var(--navy)}
.chart-pick .dn{color:var(--teal-dk);font-weight:800}
.chart-note{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:10px;text-align:center}
.journey-cta{margin-top:26px;display:flex;justify-content:center}
.journey-cta .btn{max-width:420px}

/* ---------- steps ---------- */
.steps{background:var(--bg)}
.steps4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:820px){.steps4{grid-template-columns:repeat(4,1fr);gap:16px}}
.step4{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 16px 18px;position:relative;transition:transform .3s;border:1px solid var(--line)}
@media(hover:hover){.step4:hover{transform:translateY(-5px)}}
.step4 .n{position:absolute;top:12px;inset-inline-end:12px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px}
.step4 .si{width:52px;height:52px;border-radius:15px;background:linear-gradient(150deg,var(--tsoft),#fff);border:1px solid var(--tline);
  display:grid;place-items:center;color:var(--teal-dk);margin-bottom:14px}
.step4 .si .ic{width:26px;height:26px}
.step4 b{display:block;font-size:15.5px;margin-bottom:4px;font-family:var(--disp);font-weight:800}
.step4 p{font-size:13px;color:var(--muted);line-height:1.55}
.nolist{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:26px}
.no{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1.5px solid #DCF0E4;color:#1F7A52;
  border-radius:100px;padding:9px 16px;font-size:13.5px;font-weight:700}
.no .ic{width:14px;height:14px;stroke-width:2.6;color:var(--green)}

/* ---------- what you get + stack ---------- */
.get{background:var(--white)}
.stack{max-width:520px;margin:0 auto;background:linear-gradient(140deg,var(--navy),#0C2F55);color:#fff;border-radius:var(--r-lg);
  padding:26px 22px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.stack::before{content:"";position:absolute;top:-60px;inset-inline-start:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(14,158,142,.4),transparent 68%)}
.stack .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;font-size:14.5px;position:relative;z-index:2}
.stack .r+.r{border-top:1px dashed rgba(255,255,255,.16)}
.stack .r span:last-child{font-weight:700;white-space:nowrap}
.stack .r:not(.free) span:last-child{font-weight:600;font-size:13px;opacity:.6}
.stack .r.free span:last-child{color:#7BE0AE}
.stack .total{margin-top:14px;padding-top:18px;border-top:2px solid rgba(255,255,255,.28);position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack .total .lbl{font-size:15px;font-weight:600;opacity:.92}
.stack .total .amt{font-family:var(--disp);font-size:clamp(24px,6.4vw,34px);font-weight:800;line-height:1.15;text-align:end}
.stack .total .amt small{font-size:.46em;opacity:.85;margin-inline-start:5px;font-weight:700}
.stack .total .amt.noprice{font-size:clamp(17px,4.2vw,21px);line-height:1.35;max-width:58%}
.stack .total .amt.noprice small{display:block;margin:2px 0 0;font-size:.72em;opacity:.78;font-weight:600}
.stack .note{position:relative;z-index:2;margin-top:12px;font-size:12.5px;opacity:.82;text-align:center;line-height:1.6}
.stack .sgrp{position:relative;z-index:2;font-size:11.5px;font-weight:800;letter-spacing:.06em;margin-bottom:2px}
.stack .sgrp.free{color:#7BE0AE}
.stack .sgrp.paid{color:#9FC4E8;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.stack .sgrp+.r{border-top:0}

/* ---------- authority ---------- */
.auth{background:var(--bg)}
.authgrid{display:grid;gap:16px}
@media(min-width:860px){.authgrid{grid-template-columns:1fr 1fr}}
.authcard{background:var(--white);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.authcard .top{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(140deg,#F3F8FC,#E6EFF7);border-bottom:1px solid var(--line);padding:18px}
.authcard .top img{max-height:98px;max-width:100%;width:auto;height:auto;object-fit:contain}
.authcard .top.dark{background:linear-gradient(140deg,var(--navy),var(--navy-2))}
.authcard .top.dark img{max-height:44px;filter:brightness(0) invert(1)}
.authcard .b{padding:20px}
.authcard h3{margin-bottom:8px}
.authcard p{font-size:14.5px;color:var(--muted)}
.cred{display:inline-flex;gap:9px;align-items:flex-start;margin-top:12px;background:var(--tsoft);border:1px solid var(--tline);color:var(--navy);
  border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600;line-height:1.55}
.cred .ic{width:16px;height:16px;margin-top:2px;color:var(--teal-dk)}

/* ---------- fit ---------- */
.fit{background:var(--bg)}
.fitgrid{display:grid;gap:14px;max-width:820px;margin:0 auto}
@media(min-width:760px){.fitgrid{grid-template-columns:1fr 1fr}}
.fitcard{background:var(--white);border-radius:var(--r);padding:22px;border:1px solid var(--line)}
.fitcard.yes{border-color:#CFEBDC;box-shadow:0 6px 22px rgba(21,138,94,.1)}
.fitcard h3{margin-bottom:14px;font-size:17px;display:flex;align-items:center;gap:9px}
.fitcard h3 .ic{width:20px;height:20px;stroke-width:2.4}
.fitcard.yes h3 .ic{color:var(--green)} .fitcard.no2 h3 .ic{color:#9AA8B8}
.fitcard li{list-style:none;display:flex;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.5}
.fitcard .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
.fitcard .m .ic{width:12px;height:12px;stroke-width:3}
.yes .m{background:#E2F5EC;color:var(--green)} .no2 .m{background:#EEF1F5;color:#9AA8B8}
.no2 li{color:var(--muted)}
.safenote{max-width:820px;margin:16px auto 0;background:#FBF2DF;border:1px solid #E7D3A0;color:#7C5F12;border-radius:var(--r);
  padding:15px 17px;font-size:13px;font-weight:600;line-height:1.7;display:flex;gap:11px;align-items:flex-start}
.safenote .ic{width:19px;height:19px;flex:none;margin-top:3px}

/* ---------- faq ---------- */
.faq{background:var(--white)}
.acc{max-width:680px;margin:0 auto}
.qa{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;background:var(--white);transition:box-shadow .2s}
.qa[open]{box-shadow:var(--shadow);border-color:var(--tline)}
.qa summary{padding:17px 20px;font-weight:700;font-size:15.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";font-size:22px;color:var(--teal);font-weight:400;flex:none;transition:transform .25s}
.qa[open] summary::after{transform:rotate(45deg)}
.qa .a{padding:0 20px 18px;font-size:14.5px;color:var(--muted);line-height:1.75}
.qa .a b{color:var(--ink)}

/* ---------- final ---------- */
.final{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;text-align:center;position:relative;overflow:hidden}
.final::before{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(14,158,142,.28),transparent 62%)}
.final .wrap{position:relative;z-index:2}
.final h2{margin-bottom:14px}
.final .lead{color:#B9CDE4;margin:0 auto 22px;max-width:40ch}
.slots{display:inline-flex;align-items:center;gap:9px;background:rgba(249,140,65,.15);border:1px solid rgba(249,140,65,.42);
  color:#F9C79C;border-radius:100px;padding:9px 18px;font-size:13.5px;font-weight:700;margin-bottom:22px}
.slots .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
.final .btn{max-width:420px;margin:0 auto}
.final .fine{font-size:12.5px;color:#8FA8C2;margin-top:16px;line-height:1.7;max-width:46ch;margin-inline:auto}

/* ---------- footer ---------- */
footer{background:var(--navy-2);color:#8FA8C2;padding:34px 0 26px;font-size:12.5px;text-align:center}
footer .lgs{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:18px;opacity:.85}
footer .lg-saleem{height:22px}
footer .lg-novo{height:38px}
footer .lgs img{filter:brightness(0) invert(1)}
footer .dis{max-width:64ch;margin:0 auto 16px;line-height:1.8;opacity:.85}
footer .contact{margin-bottom:14px;line-height:1.9;font-variant-numeric:tabular-nums}

/* ---------- sticky ---------- */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;box-shadow:0 -6px 26px rgba(10,46,87,.11);
  transform:translateY(110%);transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.sticky.on{transform:translateY(0)}
.sticky .p{flex:none;line-height:1.2}
.sticky .p b{display:block;font-size:15px;font-weight:800;font-family:var(--disp);color:var(--navy);white-space:nowrap}
.sticky .p span{font-size:10.5px;color:var(--muted);font-weight:600}
.sticky .btn{padding:14px 20px;font-size:15.5px;flex:1}
@media(min-width:760px){.sticky{justify-content:center;gap:26px}.sticky .btn{flex:0 1 340px}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  *{animation:none!important}
  html{scroll-behavior:auto}
}

/* ══════════ QUIZ + THANK YOU ══════════ */
.view{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none}
.view.on{display:block;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.locked{overflow:hidden}

.qhead{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.qhead .bar{display:flex;align-items:center;gap:12px;padding:12px 18px}
.qhead .back{width:38px;height:38px;flex:none;border-radius:50%;background:var(--bg);color:var(--navy);display:grid;place-items:center;transition:background .2s}
.qhead .back:active{background:var(--line)}
.qhead .back .ic{width:18px;height:18px;stroke-width:2.4}
[dir=rtl] .qhead .back .ic{transform:scaleX(-1)}
.qhead .mid{flex:1;text-align:center;line-height:1.2;min-width:0}
.qhead .mid b{display:block;font-size:14px;font-family:var(--disp);font-weight:800}
.qhead .mid span{font-size:11px;color:var(--muted);font-weight:600}
.qhead .chip{flex:none;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:100px;white-space:nowrap}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--navy));transition:width .4s cubic-bezier(.3,.9,.3,1)}
[dir=rtl] .prog i{background:linear-gradient(-90deg,var(--teal),var(--navy))}

.qbody{max-width:560px;margin:0 auto;padding:28px 20px 48px;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center}
.qstep{display:none;animation:qin .34s cubic-bezier(.2,.8,.3,1)}
.qstep.on{display:block}
@keyframes qin{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
[dir=ltr] .qstep{animation-name:qinL}
@keyframes qinL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.qstep .qn{font-size:12.5px;font-weight:800;color:var(--teal-dk);letter-spacing:.05em;margin-bottom:10px}
.qstep h2{font-size:clamp(22px,5.6vw,31px);margin-bottom:8px}
.qstep .hint{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.65}

/* tap options */
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:13px;background:var(--white);border:2px solid var(--line);border-radius:var(--r);
  padding:17px 18px;text-align:start;font-size:16px;font-weight:600;color:var(--ink);min-height:64px;width:100%;
  transition:border-color .18s,background .18s,transform .12s}
.opt .k{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  color:transparent;transition:all .18s}
.opt .k .ic{width:13px;height:13px;stroke-width:3}
.opt:active{transform:scale(.985)}
@media(hover:hover){.opt:hover{border-color:var(--tline);background:#FAFEFD}}
.opt.sel{border-color:var(--teal);background:var(--tsoft)}
.opt.sel .k{background:var(--teal);border-color:var(--teal);color:#fff}

/* fields */
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.field label .req{color:#C9737D}
.inp{width:100%;background:var(--white);border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;
  font-family:inherit;color:var(--ink);transition:border-color .18s;min-height:54px}
.inp:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,158,142,.13)}
.inp::placeholder{color:#A9B6C6}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235E7488' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-size:20px;padding-inline-end:44px}
[dir=rtl] select.inp{background-position:left 16px center}
[dir=ltr] select.inp{background-position:right 16px center}
.field.err .inp{border-color:#C9737D;background:#FEF8F9}
.field .msg{display:none;font-size:12.5px;color:#C9737D;font-weight:600;margin-top:6px}
.field.err .msg{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:15px;font-size:15.5px;font-weight:700;
  color:var(--ink);min-height:54px;transition:all .18s}
.seg button.sel{border-color:var(--teal);background:var(--tsoft);color:var(--tdeep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{background:var(--white);border:2px solid var(--line);border-radius:100px;padding:11px 17px;font-size:14.5px;font-weight:600;
  color:var(--ink);transition:all .18s;min-height:46px;text-align:start}
.chip2.sel{border-color:var(--teal);background:var(--tsoft);color:var(--tdeep)}
.chip2.warn.sel{border-color:var(--amber);background:#FBF2DF;color:#7C5F12}
.phone .inp{direction:ltr;text-align:left;letter-spacing:.06em;font-weight:600}
[dir=rtl] .phone .inp{text-align:right}
.wa{display:flex;align-items:center;gap:10px;background:#EDFBF2;border:1.5px solid #C9EEDA;border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer}
.wa input{width:20px;height:20px;accent-color:var(--green);flex:none}
.wa span{font-size:13.5px;font-weight:600;color:#1F7A52}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.55}
.secure .ic{width:15px;height:15px;flex:none}
.qnext{margin-top:22px}
.livebmi{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--white);border:1px solid var(--line);
  border-radius:14px;padding:13px;margin-top:4px;font-size:14px;font-weight:700;color:var(--navy);min-height:50px}
.livebmi.off{color:var(--muted);font-weight:500}
.livebmi .v{font-size:20px;font-family:var(--disp);font-weight:800}
.gate{display:none;margin-top:14px;border-radius:12px;padding:13px 15px;background:#FBF2DF;border:1px solid #E7D3A0;color:#7C5F12;font-size:13px;font-weight:600;line-height:1.6}
.gate.show{display:block}
.spin{width:19px;height:19px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result screen */
.res .rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.res .bmichip{font-size:12.5px;font-weight:700;color:var(--navy);background:var(--white);border:1px solid var(--line);border-radius:20px;padding:6px 13px}
.res .tag{font-family:var(--disp);font-weight:800;font-size:13px;padding:6px 15px;border-radius:20px;color:#fff}
.res .meter{height:10px;border-radius:6px;background:#DCE5EE;overflow:hidden}
.res .meter i{display:block;height:100%;border-radius:6px;width:0;transition:width .6s cubic-bezier(.3,.9,.3,1),background .3s}
.res .scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-top:6px}
.res .rmsg{font-size:15px;line-height:1.75;margin-top:14px}
.res .rmsg b{color:var(--navy)}
.res .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.res .chartcard{margin-bottom:16px;background:var(--white)}
.res .tick{width:74px;height:74px;margin:0 auto 16px}
.tick.warn{background:#FBF2DF}
.tick.warn path{stroke:var(--amber)}

.tick{width:88px;height:88px;margin:0 auto 20px;border-radius:50%;background:#E4F6EC;display:grid;place-items:center}
.tick svg{width:44px;height:44px}
.tick path{stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;
  stroke-dasharray:48;stroke-dashoffset:48;animation:draw .5s .15s forwards cubic-bezier(.6,0,.3,1)}
@keyframes draw{to{stroke-dashoffset:0}}

/* decline */
.decline{text-align:center;padding:26px 0}
.decline .em{width:74px;height:74px;margin:0 auto 16px;border-radius:50%;background:var(--tsoft);display:grid;place-items:center;color:var(--teal-dk)}
.decline .em .ic{width:34px;height:34px}
.decline h2{margin-bottom:10px}
.decline p{color:var(--muted);font-size:15.5px;margin-bottom:22px;max-width:36ch;margin-inline:auto}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--white);border:2px solid var(--line);
  color:var(--navy);font-weight:800;padding:15px 26px;border-radius:100px;font-size:15.5px;width:100%;max-width:340px;text-decoration:none}

/* ══════════ THANK YOU ══════════ */
#thanks{background:var(--white)}
.ty{max-width:600px;margin:0 auto;padding:34px 20px 60px;text-align:center}
.ty .tick{width:96px;height:96px;margin-bottom:22px}
.ty h1{font-size:clamp(27px,6.6vw,40px);margin-bottom:10px}
.ty .sub{font-size:16px;color:var(--muted);margin-bottom:8px}
.ty .ph{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 18px;font-weight:800;
  font-size:17px;direction:ltr;margin-bottom:26px;font-variant-numeric:tabular-nums}
.ty .player{margin-bottom:26px}
.tysteps{display:grid;gap:10px;margin-bottom:24px;text-align:start}
.tystep{display:flex;align-items:center;gap:13px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.tystep .c{width:46px;height:46px;flex:none;border-radius:50%;background:var(--white);border:2px solid var(--tline);display:grid;place-items:center;color:var(--teal-dk)}
.tystep .c .ic{width:22px;height:22px}
.tystep b{display:block;font-size:15px;font-family:var(--disp);font-weight:800}
.tystep span{font-size:12.5px;color:var(--muted)}
.tynote{background:var(--navy);color:#fff;border-radius:var(--r);padding:15px 17px;margin-bottom:22px;font-size:14px;line-height:1.7;text-align:start}
.tynote b{display:block;font-family:var(--disp);font-weight:800;margin-bottom:3px}
.sharecard{background:linear-gradient(140deg,var(--tsoft),#F4FCFB);border:1.5px solid var(--tline);border-radius:var(--r-lg);
  padding:22px 18px;margin-bottom:14px;text-align:center}
.sharecard .em{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--teal-dk)}
.sharecard .em .ic{width:26px;height:26px}
.sharecard h3{font-size:17.5px;margin-bottom:7px}
.sharecard p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px;max-width:36ch;margin-inline:auto}
.wabtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;font-family:var(--disp);font-weight:800;
  font-size:16.5px;padding:16px;border-radius:100px;width:100%;box-shadow:0 8px 22px rgba(37,211,102,.3);text-decoration:none;margin-bottom:14px}
.savecard{background:var(--bg);border:1px dashed var(--line);border-radius:var(--r);padding:16px;font-size:13.5px;color:var(--muted);line-height:1.7}
.savecard b{color:var(--ink);direction:ltr;display:inline-block;unicode-bidi:isolate;font-weight:800}
</style>
</head>

<!-- ══════════ WHAT YOU GET + VALUE STACK ══════════ -->
<section class="get sec">
  <div class="wrap">
    <div class="head rv">

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const AR = '٠١٢٣٤٥٦٧٨٩';

// Arabic is the default for this campaign — most Iraqi phones report an English
// locale, so we do NOT sniff navigator.language. Only an explicit switch changes it.
let lang = 'ar';
try{ if(localStorage.getItem('oz_lang') === 'en') lang = 'en'; }catch(e){}

const t      = k => (T[lang][k] !== undefined ? T[lang][k] : k);
const toAr   = s => String(s).replace(/\d/g, d => AR[d]);
const fmtNum = n => lang==='ar' ? toAr(n) : String(n);
const track  = (ev,data={}) => { if(window.fbq) fbq('track',ev,data); console.log('📊',ev,data); };

/* ── apply a language across the whole document ─────────── */
function applyLang(){
  const T0 = T[lang];
  document.documentElement.lang = T0._lang;
  document.documentElement.dir  = T0._dir;
  try{ localStorage.setItem('oz_lang', lang); }catch(e){}

  $$('[data-t]').forEach(el  => el.textContent = t(el.dataset.t));
  $$('[data-th]').forEach(el => el.innerHTML   = t(el.dataset.th));
  $$('[data-tp]').forEach(el => el.placeholder = t(el.dataset.tp));
  $$('[data-ta]').forEach(el => el.setAttribute('aria-label', t(el.dataset.ta)));

  $('#lang').textContent   = T0._langBtn;
  $('#qlang').textContent  = T0._langBtn;
  if(!lastBand) $('#resCta').textContent = t('cta.resNext');
  $('#qchip').textContent  = t('quiz.chip');
    $('#footContact').textContent = 'Saleem — Baghdad, Iraq · info@saleemapp.com · ' + CONFIG.bizPhone;
  $('#bizphone').textContent  = CONFIG.bizPhone;

  // numbered chips
  $$('.step4 .n').forEach((el,i) => el.textContent = fmtNum(i+1));
  $$('.tli .n').forEach((el,i)   => el.textContent = fmtNum(i+1));

  // price
  const amtEl = $('#stackAmt');
  amtEl.classList.toggle('noprice', !(CONFIG.priceIqd > 0));
  amtEl.innerHTML = CONFIG.priceIqd > 0
    ? fmtNum(CONFIG.priceIqd.toLocaleString('en-US')) + '<small>' + (lang==='ar'?'د.ع':'IQD') + '</small>'
    : t('stack.byDose');

  // faq
  $('#acc').innerHTML = T0.faq.map(([q,a]) =>
    '<details class="qa"><summary>'+q+'</summary><div class="a">'+a+'</div></details>').join('');

  // anything already on screen
  drawDemo();
  paint();
  if(lastBand) renderResult();
}

/* ═══════════════════════════════════════════════════════════
   PROJECTION CHART
   ═══════════════════════════════════════════════════════════ */
const MONTHLY_LOSS = [0, .025, .05, .07, .085, .095, .105];   // cumulative fraction of starting weight
const ease = x => 1 - Math.pow(1-x, 3);

function drawChart(svg, start, headEl, pickEl, noteEl, noteKey){
  const w = MONTHLY_LOSS.map(p => start * (1-p));
  const now = new Date(), labels = [];
  for(let i=0;i<7;i++){
    labels.push(new Date(now.getFullYear(), now.getMonth()+i, 1)
      .toLocaleString(T[lang]._locale, {month:'short'}));
  }

  const W=360,H=190,padL=18,padR=18,padT=28,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB, bottom=padT+plotH;
  const wmax=start, wmin=w[6], pad=(wmax-wmin)*0.45+1, minW=wmin-pad;
  const X = i => padL + (i/6)*plotW;
  const Y = v => padT + (wmax-v)/(wmax-minW)*plotH;
  const P = w.map((v,i) => ({x:X(i), y:Y(v)}));

  let line='', area='';
  P.forEach((p,i)=>{ const sg=(i?' L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1); line+=sg; area+=sg; });
  area += ' L'+P[6].x.toFixed(1)+','+bottom+' L'+P[0].x.toFixed(1)+','+bottom+' Z';

  const seg=[]; let tot=0;
  for(let i=0;i<6;i++){ seg.push(Math.hypot(P[i+1].x-P[i].x, P[i+1].y-P[i].y)); tot+=seg[i]; }

  const gid = svg.id+'-grad';
  let s = '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0" stop-color="#0E9E8E" stop-opacity="0.28"/>'
        + '<stop offset="1" stop-color="#0E9E8E" stop-opacity="0.02"/></linearGradient></defs>';
  s += '<path d="'+area+'" fill="url(#'+gid+')"/>';
  s += '<path class="ln" d="'+line+'" fill="none" stroke="#0E9E8E" stroke-width="2.6" stroke-linecap="round" '
     + 'stroke-linejoin="round" stroke-dasharray="'+tot.toFixed(1)+'" stroke-dashoffset="'+tot.toFixed(1)+'"/>';
  labels.forEach((lb,i) => {
    const first = i===0;
    s += '<text x="'+P[i].x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-family="Cairo,Arial" font-size="8.5" '
       + 'font-weight="'+(first?'700':'400')+'" fill="'+(first?'#0E3A66':'#7B8699')+'">'+lb+'</text>';
  });
  s += '<line class="selLine" x1="0" y1="0" x2="0" y2="0" stroke="#0E9E8E" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
  s += '<circle class="selDot" cx="0" cy="0" r="4.5" fill="#0E9E8E" style="display:none"/>';
  s += '<g class="selPill" style="display:none"><rect rx="5" ry="5" height="16" fill="#0A5A50"/>'
     + '<text text-anchor="middle" font-family="Cairo,Arial" font-size="10.5" font-weight="800" fill="#fff"></text></g>';
  s += '<circle cx="'+P[0].x.toFixed(1)+'" cy="'+P[0].y.toFixed(1)+'" r="4" fill="#0E3A66"/>';
  s += '<text x="'+P[0].x.toFixed(1)+'" y="'+(P[0].y-9).toFixed(1)+'" text-anchor="middle" font-family="Cairo,Arial" '
     + 'font-size="10" font-weight="800" fill="#0E3A66">'+Math.round(w[0])+'</text>';
  s += '<circle cx="'+P[6].x.toFixed(1)+'" cy="'+P[6].y.toFixed(1)+'" r="6" fill="#fff" stroke="#0E9E8E" stroke-width="2.5"/>'
     + '<circle cx="'+P[6].x.toFixed(1)+'" cy="'+P[6].y.toFixed(1)+'" r="2.6" fill="#0E9E8E"/>';
  s += '<text x="'+P[6].x.toFixed(1)+'" y="'+(P[6].y-11).toFixed(1)+'" text-anchor="end" font-family="Cairo,Arial" '
     + 'font-size="10.5" font-weight="800" fill="#0A5A50">'+Math.round(w[6])+'</text>';
  s += '<g class="head" style="display:none"><path d="M-4,-4 L5,0 L-4,4 L-1.5,0 Z" fill="#0A5A50"/></g>';
  // one hit area over the whole plot — a tap anywhere snaps to the nearest month
  s += '<rect class="hit" x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent" pointer-events="all"/>';

  svg.innerHTML = s;
  svg._ch = {P, w, labels, bottom, pickEl, padL, plotW, W};

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ln = svg.querySelector('.ln');
  if(ln){
    if(reduce){ ln.style.strokeDashoffset = '0'; }
    else { void ln.getBBox(); ln.style.transition = 'stroke-dashoffset .9s ease'; ln.style.strokeDashoffset = '0'; }
  }

  const head = svg.querySelector('.head');
  if(head && !reduce){
    const pointAt = f => {
      let d = f*tot, i = 0;
      while(i < 6 && d > seg[i]){ d -= seg[i]; i++; }
      const L = seg[i] || 1, r = d/L, a = P[i], b = P[Math.min(i+1,6)];
      return {x:a.x+(b.x-a.x)*r, y:a.y+(b.y-a.y)*r, ang:Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI};
    };
    head.style.display = '';
    let t0 = null;
    const stepA = ts => {
      if(!t0) t0 = ts;
      const f = Math.min(1, (ts-t0)/950), pt = pointAt(ease(f));
      head.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+') rotate('+pt.ang.toFixed(1)+')');
      if(f < 1) requestAnimationFrame(stepA); else head.style.display = 'none';
    };
    requestAnimationFrame(stepA);
  }

  const hit = svg.querySelector('.hit');
  const nearest = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * W;          // client px -> viewBox units
    return Math.max(0, Math.min(6, Math.round((x - padL) / plotW * 6)));
  };
  hit.addEventListener('pointerdown', ev => {
    hit.setPointerCapture(ev.pointerId);
    selectMonth(svg, nearest(ev));
  });
  hit.addEventListener('pointermove', ev => {                // drag to scrub across months
    if(ev.buttons) selectMonth(svg, nearest(ev));
  });

  headEl.innerHTML = t('res.chartH')
    .replace('{w}',   fmtNum(Math.round(start)))
    .replace('{m}',   fmtNum(Math.round(w[6])))
    .replace('{k}',   fmtNum(Math.round(start) - Math.round(w[6])))
    .replace('{mon}', labels[6]);
  pickEl.textContent = t('res.pick');
  noteEl.textContent = t(noteKey);
}

function selectMonth(svg, i){
  const ch = svg._ch; if(!ch) return;
  const {P, w, labels, bottom, pickEl, W} = ch;
  if(ch.sel === i) return;                                   // same month, nothing to redraw
  ch.sel = i;

  const ln = svg.querySelector('.selLine'), dot = svg.querySelector('.selDot');
  ln.setAttribute('x1', P[i].x.toFixed(1)); ln.setAttribute('x2', P[i].x.toFixed(1));
  ln.setAttribute('y1', P[i].y.toFixed(1)); ln.setAttribute('y2', bottom);
  ln.style.display = '';
  dot.setAttribute('cx', P[i].x.toFixed(1)); dot.setAttribute('cy', P[i].y.toFixed(1));
  dot.style.display = '';

  const wt = Math.round(w[i]), k = Math.round(w[0]) - wt;

  // the weight itself, on the chart, above the point
  const pill = svg.querySelector('.selPill');
  const rect = pill.querySelector('rect'), txt = pill.querySelector('text');
  const label = String(wt);
  const pw = label.length * 6.6 + 12;
  let px = P[i].x - pw/2;
  px = Math.max(2, Math.min(W - pw - 2, px));               // keep it inside the frame
  const py = Math.max(2, P[i].y - 24);
  rect.setAttribute('x', px.toFixed(1)); rect.setAttribute('y', py.toFixed(1));
  rect.setAttribute('width', pw.toFixed(1));
  txt.setAttribute('x', (px + pw/2).toFixed(1)); txt.setAttribute('y', (py + 11.6).toFixed(1));
  txt.textContent = label;
  pill.style.display = '';
  pickEl.innerHTML = '<b>'+labels[i]+'</b> · '+t('res.approx')+fmtNum(wt)+' '+t('res.kg')
    + (i===0 ? ' · '+t('res.now') : ' · <span class="dn">↓'+fmtNum(k)+' '+t('res.kg')+'</span>');
}

const quiz = $('#quiz'), thanks = $('#thanks');
const ORDER = ['1','2','3','4','r','5'];
const QCOUNT = 4;                       // questions shown in the counter
const answers = {};
let idx = 0, hot = false, busy = false, lastBand = null;

// history is a nicety, not a dependency: pushState throws on file:// URLs, and the
// funnel has to keep working when the standalone build is opened straight off disk.
const HISTORY_OK = (() => {
  try{ history.replaceState(history.state, '', location.href); return true; }
  catch(e){ console.warn('⚠️ history API unavailable (file:// ?) — back button disabled'); return false; }
})();
const push = (state, hash) => { if(HISTORY_OK){ try{ history.pushState(state, '', hash); }catch(e){} } };

function showView(v){
  [quiz,thanks].forEach(n => n.classList.remove('on'));
  document.body.classList.toggle('locked', !!v);
  if(v){ v.classList.add('on'); v.scrollTop = 0; }
}

function paint(){
  idx = Math.max(0, Math.min(idx, ORDER.length-1));
  const key = ORDER[idx];
  $$('.qstep').forEach(s => s.classList.toggle('on', s.dataset.q === key));
  $('#qcount').textContent =
      key === 'r' ? t('quiz.res')
    : key === '5' ? t('quiz.last')
    : t('quiz.of').replace('{n}', fmtNum(idx+1)).replace('{t}', fmtNum(QCOUNT));
  $('#qprog').style.width = ((idx+1)/ORDER.length*100) + '%';
  quiz.scrollTop = 0;
}

function openQuiz(src){
  idx = 0; paint(); showView(quiz);
  push({v:'quiz'}, '#quiz');
  track('InitiateCheckout', {content_name:'ozempic_quiz_start', source:src});
}
function closeQuiz(){ showView(null); if(HISTORY_OK && location.hash) history.back(); }

$$('[data-quiz]').forEach(b => b.addEventListener('click', () => openQuiz(b.dataset.quiz)));

$('#qback').addEventListener('click', () => {
  if(idx === 0) return closeQuiz();
  idx--; busy = false; paint();
});

/* ── tap options (q3) → highlight, then auto-advance ── */
$$('.opts .opt').forEach(opt => {
  opt.addEventListener('click', () => {
    if(busy) return;                                   // ignore double-taps
    busy = true;
    const grp = opt.closest('.opts');
    grp.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
    opt.classList.add('sel');
    answers[grp.dataset.name] = opt.dataset.v;
    if(opt.dataset.hot) hot = true;

    setTimeout(() => {
      idx++;
      paint();
      if(ORDER[idx] === 'r') renderResult();
      busy = false;
    }, 260);
  });
});

$$('#sex button').forEach(b => b.addEventListener('click', () => {
  $$('#sex button').forEach(x => x.classList.remove('sel'));

/* ── step 2: live BMI ──────────────────────────────────── */
function bmiOf(){
  const h = parseFloat(hEl.value), w = parseFloat(wEl.value);
  if(!(h >= 100 && h <= 230) || !(w >= 30 && w <= 350)) return null;
  return +(w / Math.pow(h/100, 2)).toFixed(1);
}
function paintBmi(){
  const b = bmiOf(), el = $('#liveBmi');
  if(b === null){ el.className = 'livebmi off'; el.textContent = t('f.bmiIdle'); return; }
  el.className = 'livebmi';
  el.innerHTML = t('f.bmiVal') + ' <span class="v">' + fmtNum(b) + '</span>';
}
[hEl, wEl].forEach(el => el.addEventListener('input', paintBmi));

/* ── step 4: safety chips ──────────────────────────────── */
$$('#safety .chip2').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.v === 'none'){
    $$('#safety .chip2').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  } else {
    $('#safety .chip2[data-v=none]').classList.remove('sel');
    b.classList.toggle('sel');
  }
  answers.safety = $$('#safety .chip2.sel').map(x => x.dataset.v).filter(v => v !== 'none');
  const flagged = answers.safety.length > 0;
  $('#safeGate').textContent = flagged ? t('gate.safety') : '';
  $('#safeGate').classList.toggle('show', flagged);
}));

/* ── "Next" buttons on the input steps ─────────────────── */
function fail(name){ $('[data-f='+name+']').classList.add('err'); return false; }
$$('.inp').forEach(i => i.addEventListener('input', () => i.closest('.field').classList.remove('err')));

$$('[data-next]').forEach(btn => btn.addEventListener('click', () => {
  const step = btn.dataset.next;
  let ok = true;

  if(step === '1'){
    const a = parseInt(ageEl.value, 10);
    if(!(a >= 18 && a <= 110)) ok = fail('age');
    if(!answers.sex)           ok = fail('sex');
    if(ok) answers.age = a;
  }
  if(step === '2'){
    const h = parseFloat(hEl.value), w = parseFloat(wEl.value);
    if(!(h >= 100 && h <= 230)) ok = fail('h');
    if(!(w >= 30  && w <= 350)) ok = fail('w');
    if(ok){ answers.height_cm = h; answers.weight_kg = w; answers.bmi = bmiOf(); }
  }
  if(step === '4' && !answers.safety) answers.safety = [];

  if(!ok){ $('.qstep.on .field.err')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }

  idx++; paint();
  if(ORDER[idx] === 'r') renderResult();
}));

/* ── the result screen ─────────────────────────────────── */
function computeBand(){
  const bmi = answers.bmi, cond = answers.condition;
  if(answers.safety && answers.safety.length) return 'Review';
  if(bmi >= 30 || (bmi >= 27 && cond === 'yes')) return 'Likely';
  if(bmi >= 27 || cond === 'yes')               return 'Possible';
  return 'Unlikely';
}

function renderResult(){
  lastBand = computeBand();
  const b = T[lang].bands[lastBand];
  hot = lastBand === 'Likely';

  $('#resH').textContent      = b.h;
  $('#resBmi').textContent    = t('res.bmi') + ' ' + fmtNum(answers.bmi);
  $('#resTag').textContent    = b.tag;
  $('#resTag').style.background = b.col;
  $('#resFill').style.width   = b.pct + '%';
  $('#resFill').style.background = b.col;
  $('#resMsg').innerHTML      = b.msg;

  const tick = $('#resTick');
  tick.style.display = lastBand === 'Unlikely' ? 'none' : '';
  tick.classList.toggle('warn', lastBand === 'Review');
  $('#resCta').textContent = t(lastBand === 'Unlikely' ? 'cta.resNextSoft' : 'cta.resNext');

  const showChart = lastBand !== 'Unlikely';
  $('#resChartCard').style.display = showChart ? '' : 'none';
  if(showChart) drawChart($('#resChart'), answers.weight_kg, $('#resH2'), $('#resPick'), $('#resNote'), 'res.note');

  track('QuizQualified', {band:lastBand, bmi:answers.bmi, hot});
}

/* ═══════════════════════════════════════════════════════════
   LEAD FORM
   ═══════════════════════════════════════════════════════════ */
const phone = $('input[name=phone]');
phone.addEventListener('input', () => {                 // mask: 0770 000 0000
  const d = phone.value.replace(/\D/g,'').slice(0,11);
  phone.value = [d.slice(0,4), d.slice(4,7), d.slice(7,11)].filter(Boolean).join(' ');
  $('[data-f=phone]').classList.remove('err');
});
$('select[name=area]').addEventListener('change', () => $('[data-f=area]').classList.remove('err'));

$('#qform').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const dig  = phone.value.replace(/\D/g,'');
  const area = f.area.value;
  let ok = true;

  if(name.length < 3)        ok = fail('name');
  if(!/^07\d{9}$/.test(dig)) ok = fail('phone');
  if(!area)                  ok = fail('area');
  if(!ok){ $('.qstep.on .field.err')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }

  const btn = $('#qsub'), label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  const lead = {
    age:        answers.age,
    sex:        answers.sex,
    height_cm:  answers.height_cm,
    weight_kg:  answers.weight_kg,
    bmi:        answers.bmi,
    condition:  answers.condition   || null,
    safety:     answers.safety      || [],
    band:       lastBand,
    hot,
    name, area,
    phone:      dig,
    whatsapp:   $('#wa').checked,
    program:    'ozempic',
    price_iqd:  CONFIG.priceIqd || null,
    lang, url: location.href, ts: new Date().toISOString()
  };

  try{
    if(CONFIG.endpoint){
      const r = await fetch(CONFIG.endpoint, {
        method  : 'POST',
        headers : {'Content-Type': CONFIG.endpointType || 'application/json'},
        body    : JSON.stringify(lead)
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
    } else {
      console.log('🧪 DEMO MODE — lead not sent. Payload:', lead);
      await new Promise(r => setTimeout(r, 900));
    }
    track('Lead', {content_name:'ozempic_program', band:lastBand, hot});
    track('CompleteRegistration', CONFIG.priceIqd ? {value:CONFIG.priceIqd, currency:'IQD'} : {});
    goThanks(dig);
  }catch(err){
    console.error(err);
    btn.disabled = false; btn.innerHTML = label;
    alert(t('err.send'));
  }
});

/* ═══════════════════════════════════════════════════════════
   THANK YOU
   ═══════════════════════════════════════════════════════════ */
function goThanks(dig){
  $('#typhone').textContent = [dig.slice(0,4), dig.slice(4,7), dig.slice(7,11)].join(' ');
  $('#wabtn').href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(t('ty.waMsg'));

  // no number in the wa.me link, so WhatsApp opens its own contact picker
  const link = CONFIG.shareUrl ||
    (location.origin + location.pathname + '?utm_source=whatsapp&utm_medium=referral&utm_campaign=ozempic');
  $('#sharebtn').href = 'https://wa.me/?text=' +
    encodeURIComponent(CONFIG.shareText[lang].replace('{link}', link));

  showView(thanks);
  push({v:'thanks'}, '#thanks');
}
$('#sharebtn').addEventListener('click', () => track('Share', {method:'whatsapp', content_name:'ozempic_program'}));

/* ═══════════════════════════════════════════════════════════
   REVEAL / STICKY / NAV
   ═══════════════════════════════════════════════════════════ */

const io = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), {threshold:.12, rootMargin:'0px 0px -40px'});
$$('.rv').forEach((el,i) => { el.style.transitionDelay = (i%4)*60 + 'ms'; io.observe(el); });

const sticky = $('#sticky');
new IntersectionObserver(([e]) => sticky.classList.toggle('on', !e.isIntersecting), {threshold:0})
  .observe($('.hero'));

const toggleLang = () => { lang = (lang === 'ar' ? 'en' : 'ar'); applyLang(); };
$('#lang').addEventListener('click', toggleLang);
$('#qlang').addEventListener('click', toggleLang);

addEventListener('popstate', () => {
  const h = location.hash;
  if(h === '#quiz')        showView(quiz);
  else if(h === '#thanks') showView(thanks);
  else                     showView(null);
});

/* ── go ────────────────────────────────────────────────── */
applyLang();
paintBmi();
if(location.hash === '#quiz') openQuiz('direct');
</script>
</body>
</html>
